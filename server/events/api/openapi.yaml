        Детерминированный подбор из ближайших 1000 опубликованных событий в горизонте 60 дней. Учитывает
        явные интересы, записи и активные запросы компании. Уже записанные, отклонённые, скрытые пользователем
        и события со скрытым направлением исключаются. Радиус ограничивает офлайн-события; онлайн доступны
        независимо от места. offset относится к текущей подборке, при изменении данных начните с нуля.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000
  /api/v1/events/{id}/recommendation-feedback:
    parameters:
      - name: id
        in: path
        required: true
        schema: &a1
          type: string
          format: uuid
    post:
      tags:
        - Персональная подборка и прогресс
      operationId: recommendationFeedback
      summary: Просмотр, интерес, скрытие или сброс скрытия
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationFeedback'
      responses:
        '204':
          description: Сохранено
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/progress:
    get:
      tags:
        - Персональная подборка и прогресс
      operationId: personalProgress
      summary: Личный прогресс и достижения
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProgress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: starter_admin_session
      description:
        Сессия админки — отдельная от пользовательской. Ставится после `POST /auth/admin/login`, хранит
        только случайный идентификатор. Пользовательская cookie и Bearer-токен к `/api/v1/admin/*` не
        допускаются. Изменяющие запросы требуют заголовок `Origin`, равный адресу приложения.
    cookieAuth:
      type: apiKey
      in: cookie
      name: starter_session
      description:
        Сессия браузера. Ставится после входа через `/auth/login`, хранит только случайный идентификатор
        (токены Keycloak лежат на сервере). Изменяющие запросы с cookie дополнительно требуют заголовок
        `Origin`, равный адресу приложения (защита от CSRF).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        'Access token Keycloak для внешних клиентов и тестов. Получить локально: `POST
        http://localhost:8180/realms/hackathon/protocol/openid-connect/token` с `grant_type=password`,
        `client_id=hackathon-cli`, логином и паролем демо-пользователя.'
    keycloak:
      type: oauth2
      description:
        'Вход через Keycloak прямо из Swagger: нажмите Authorize → keycloak → Authorize и войдите
        демо-пользователем (логины и пароли печатает make demo). Отдельный клиент hackathon-swagger с PKCE —
        на вход в приложение не влияет. Адрес Keycloak gateway подставляет из OIDC_ISSUER.'
      flows:
        authorizationCode:
          authorizationUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/auth'
          tokenUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          refreshUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          scopes:
            openid: Вход (OpenID Connect)
            profile: Имя пользователя
            email: Почта
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Идентификатор записи (UUID)
      schema:
        type: string
        format: uuid
      example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
    Limit:
      name: limit
      in: query
      description: Сколько записей вернуть (страница)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить от начала
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description:
        'Необязательный ключ защиты от двойной отправки (двойной клик, повтор после обрыва сети). Повтор
        с тем же ключом в течение 24 часов вернёт сохранённый ответ с заголовком `Idempotent-Replayed: true`,
        а не выполнит действие ещё раз.'
      schema:
        type: string
        maxLength: 100
      example: 6f1e2d3c-create-task-1
    ParticipationID:
      name: pid
      in: path
      required: true
      description: Идентификатор записи или заявки (UUID)
      schema:
        type: string
        format: uuid
    CommentID:
      name: cid
      in: path
      required: true
      description: Идентификатор сообщения (UUID)
      schema:
        type: string
        format: uuid
    DemandLiveID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      description: Единый формат ошибки всех сервисов.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Машинный код ошибки — по нему фронтенд выбирает реакцию
              example: validation_error
            message:
              type: string
              description: Сообщение для человека, на русском
              example: Название должно содержать от 1 до 200 символов
            request_id:
              type: string
              description: Идентификатор запроса — по нему ошибку находят в логах всех сервисов
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Sport:
      type: object
      required:
        - id
        - name
        - is_custom
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Шахматы
        is_custom:
          type: boolean
          description: Добавлено пользователем при создании события
    Organizer:
      type: object
      description: 'Кто проводит событие: человек (ссылка /profiles/{id}) или организация (/organizations/{id})'
      required:
        - type
        - id
        - name
      properties:
        type:
          type: string
          enum:
            - user
            - organization
        id:
          type: string
        name:
          type: string
          example: Шахматный клуб «Ладья»
    MyParticipation:
      type: object
      description: Запись текущего пользователя
      required:
        - id
        - status
        - decision_reason
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - confirmed
            - pending
            - rejected
            - cancelled
            - waitlist
          description:
            confirmed — участвует; pending — ждёт решения организатора; rejected — отказ; cancelled — отменил
            сам; waitlist — лист ожидания
        decision_reason:
          type: string
          description: Комментарий организатора при отказе
        first_time:
          type: boolean
          description: Иду впервые
        is_buddy:
          type: boolean
          description: Готов встретить новичка
        buddy:
          description: Кто встретит меня (если я новичок и пара назначена)
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Person'
        newcomers:
          type: array
          description: Кого встречаю я — только в карточке события
          items:
            $ref: '#/components/schemas/Person'
    Event:
      type: object
      required:
        - id
        - title
        - description
        - sport
        - starts_at
        - location
        - level
        - requirements
        - price_note
        - private_info
        - has_private_info
        - join_mode
        - confirmed_count
        - pending_count
        - waitlist_count
        - company_matches
        - spots_left
        - first_timers_count
        - buddies_count
        - min_participants
        - quorum_deadline
        - quorum_status
        - outdoor
        - status
        - moderation_reason
        - organizer
        - is_organizer
        - created_at
        - format
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Шахматный турнир выходного дня
        description:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          example: Красноярск, ул. Мира, 10, библиотека, 2 этаж
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        level:
          type: string
          enum:
            - any
            - beginner
            - amateur
            - pro
          description: Для кого подходит
        requirements:
          type: string
          description: Подготовка, инвентарь, форма
        price_note:
          type: string
          example: Бесплатно
        private_info:
          type: string
          description: Точка сбора и контакты. Заполнено только для организатора, подтверждённых участников и админа
        has_private_info:
          type: boolean
          description: Есть закрытая информация — клиент может подсказать «откроется после подтверждения»
        join_mode:
          type: string
          enum:
            - open
            - request
          description: open — свободная запись; request — по заявке с подтверждением
        capacity:
          type: integer
          nullable: true
          description: Лимит мест; null — без лимита
        confirmed_count:
          type: integer
        pending_count:
          type: integer
        waitlist_count:
          type: integer
        company_matches:
          type: integer
          description: Сколько людей из «Ищу компанию» получили это событие в подборке
        distance_km:
          type: number
          description: Расстояние до точки near, км (только в выдаче с near)
        spots_left:
          type: integer
          nullable: true
          description: Свободные места при лимите; null — без ограничения
        first_timers_count:
          type: integer
          description: Подтверждённые новички
        buddies_count:
          type: integer
          description: Готовы встретить новичков
        min_participants:
          type: integer
          nullable: true
        quorum_deadline:
          type: string
          format: date-time
          nullable: true
        quorum_status:
          type: string
          enum:
            - none
            - gathering
            - reached
            - failed
          description:
            none — без минимума; gathering — набираем состав; reached — собран, встреча состоится; failed —
            не набрали к сроку, событие отменено автоматически
        outdoor:
          type: boolean
        status:
          type: string
          enum:
            - published
            - unpublished
            - deleted
            - cancelled
        moderation_reason:
          type: string
          description: Причина снятия, удаления или отмены
        organizer:
          $ref: '#/components/schemas/Organizer'
        is_organizer:
