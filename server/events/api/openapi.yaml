        - Жалобы
      operationId: reportStory
      summary: Пожаловаться на историю
      description: |
        Пожаловаться может только тот, кто историю видит: друг автора, пока история не удалена и не истекла.
        Для остальных — 404, чтобы по ответу нельзя было узнать о чужой истории. Своя история — 409.
        У жалобы нет мероприятия (`event_id: null`). Фото или видео истории сохраняется для админа, пока
        жалоба открыта, даже если история истечёт.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
