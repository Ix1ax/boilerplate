                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/comments/{id}/hide:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [Модерация (админ)]
      operationId: hideComment
      summary: Скрыть сообщение
      description:
        Скрывается одно сообщение; мероприятие и остальное обсуждение остаются. Автор получит
        уведомление с причиной.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Реклама стороннего сервиса
      responses:
        '200':
          description: Сообщение скрыто
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: starter_session
      description:
        Сессия браузера. Ставится после входа через `/auth/login`, хранит только случайный идентификатор
        (токены Keycloak лежат на сервере). Изменяющие запросы с cookie дополнительно требуют заголовок
        `Origin`, равный адресу приложения (защита от CSRF).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        'Access token Keycloak для внешних клиентов и тестов. Получить локально: `POST
        http://localhost:8180/realms/hackathon/protocol/openid-connect/token` с `grant_type=password`,
        `client_id=hackathon-cli`, логином и паролем демо-пользователя.'
    keycloak:
      type: oauth2
      description:
        'Вход через Keycloak прямо из Swagger: нажмите Authorize → keycloak → Authorize и войдите
        демо-пользователем (логины и пароли печатает make demo). Отдельный клиент hackathon-swagger с PKCE —
        на вход в приложение не влияет. Адрес Keycloak gateway подставляет из OIDC_ISSUER.'
      flows:
        authorizationCode:
          authorizationUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/auth'
          tokenUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          refreshUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          scopes:
            openid: Вход (OpenID Connect)
            profile: Имя пользователя
            email: Почта
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Идентификатор записи (UUID)
      schema:
        type: string
        format: uuid
      example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
    Limit:
      name: limit
      in: query
      description: Сколько записей вернуть (страница)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить от начала
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description:
        'Необязательный ключ защиты от двойной отправки (двойной клик, повтор после обрыва сети). Повтор
        с тем же ключом в течение 24 часов вернёт сохранённый ответ с заголовком `Idempotent-Replayed: true`,
        а не выполнит действие ещё раз.'
      schema:
        type: string
        maxLength: 100
      example: 6f1e2d3c-create-task-1
    ParticipationID:
      name: pid
      in: path
      required: true
      description: Идентификатор записи или заявки (UUID)
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      description: Единый формат ошибки всех сервисов.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Машинный код ошибки — по нему фронтенд выбирает реакцию
              example: validation_error
            message:
              type: string
              description: Сообщение для человека, на русском
              example: Название должно содержать от 1 до 200 символов
            request_id:
              type: string
              description: Идентификатор запроса — по нему ошибку находят в логах всех сервисов
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Sport:
      type: object
      required: [id, name, is_custom]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Шахматы }
        is_custom:
          type: boolean
          description: Добавлено пользователем при создании события
    Organizer:
      type: object
      description: 'Кто проводит событие: человек (ссылка /profiles/{id}) или организация (/organizations/{id})'
      required: [type, id, name]
      properties:
        type: { type: string, enum: [user, organization] }
        id: { type: string }
        name: { type: string, example: Шахматный клуб «Ладья» }
    MyParticipation:
      type: object
      description: Запись текущего пользователя
      required: [id, status, decision_reason]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [confirmed, pending, rejected, cancelled, waitlist]
          description:
            'confirmed — участвует; pending — ждёт решения организатора; rejected — отказ;
            cancelled — отменил сам; waitlist — лист ожидания'
        decision_reason:
          type: string
          description: Комментарий организатора при отказе
    Event:
      type: object
      required:
        [
          id,
          title,
          description,
          sport,
          starts_at,
          location,
          level,
          requirements,
          price_note,
          private_info,
          has_private_info,
          join_mode,
          confirmed_count,
          pending_count,
          waitlist_count,
          company_matches,
          status,
          moderation_reason,
          organizer,
          is_organizer,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, example: Шахматный турнир выходного дня }
        description: { type: string }
        sport:
          $ref: '#/components/schemas/Sport'
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        location:
          {
            type: string,
            example: 'Красноярск, ул. Мира, 10, библиотека, 2 этаж',
          }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        level:
          type: string
          enum: [any, beginner, amateur, pro]
          description: Для кого подходит
        requirements:
          type: string
          description: Подготовка, инвентарь, форма
        price_note: { type: string, example: Бесплатно }
        private_info:
          type: string
          description: Точка сбора и контакты. Заполнено только для организатора, подтверждённых участников и админа
        has_private_info:
          type: boolean
          description: Есть закрытая информация — клиент может подсказать «откроется после подтверждения»
        join_mode:
          type: string
          enum: [open, request]
          description: 'open — свободная запись; request — по заявке с подтверждением'
        capacity:
          {
            type: integer,
            nullable: true,
            description: 'Лимит мест; null — без лимита',
          }
        confirmed_count: { type: integer }
        pending_count: { type: integer }
        waitlist_count: { type: integer }
        company_matches:
          type: integer
          description: Сколько людей из «Ищу компанию» получили это событие в подборке
        status:
          type: string
          enum: [published, unpublished, deleted, cancelled]
        moderation_reason:
          type: string
          description: Причина снятия, удаления или отмены
        organizer:
          $ref: '#/components/schemas/Organizer'
        is_organizer:
          type: boolean
          description: Текущий пользователь — организатор
        my_participation:
          allOf:
            - $ref: '#/components/schemas/MyParticipation'
          nullable: true
        created_at: { type: string, format: date-time }
    EventPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    EventInput:
      type: object
      required: [title, starts_at, location, join_mode]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        sport_id:
          type: string
          format: uuid
          description: Направление из справочника
        sport_name:
          type: string
          minLength: 2
          maxLength: 60
          description: Своё направление, если sport_id не задан
        starts_at: { type: string, format: date-time, description: В будущем }
        ends_at: { type: string, format: date-time, nullable: true }
        location: { type: string, minLength: 3, maxLength: 300 }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        level:
          { type: string, enum: [any, beginner, amateur, pro], default: any }
        requirements: { type: string, maxLength: 2000 }
        price_note: { type: string, maxLength: 200 }
        private_info: { type: string, maxLength: 2000 }
        join_mode: { type: string, enum: [open, request] }
        capacity: { type: integer, minimum: 1, maximum: 10000, nullable: true }
        as_organization:
          type: boolean
          default: false
          description: От имени своей допущенной организации
    Person:
      type: object
      required: [id, name, level]
      properties:
        id: { type: string }
        name: { type: string, example: Анна Петрова }
        level: { type: string, description: 'beginner, amateur, pro или пусто' }
    Participant:
      type: object
      required: [id, user, status, message, decision_reason, created_at]
      properties:
        id: { type: string, format: uuid }
        user:
          $ref: '#/components/schemas/Person'
        status:
          {
            type: string,
            enum: [confirmed, pending, rejected, cancelled, waitlist],
          }
        message:
          type: string
          description: Сообщение к заявке (видит только организатор)
        decision_reason: { type: string }
        created_at: { type: string, format: date-time }
    MyEntry:
      allOf:
        - $ref: '#/components/schemas/MyParticipation'
        - type: object
          required: [event]
          properties:
            event:
              type: object
              required:
                [
                  id,
                  title,
                  sport,
                  starts_at,
                  location,
                  join_mode,
                  status,
                  moderation_reason,
                ]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                sport: { type: string }
                starts_at: { type: string, format: date-time }
                location: { type: string }
                join_mode: { type: string, enum: [open, request] }
                status:
                  {
                    type: string,
                    enum: [published, unpublished, deleted, cancelled],
                  }
                moderation_reason: { type: string }
    Comment:
      type: object
      required:
        [
          id,
          event_id,
          author,
          is_organizer,
          organization_name,
          body,
          status,
          hidden_reason,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        author:
          $ref: '#/components/schemas/Person'
        is_organizer:
          type: boolean
          description: Автор — организатор события (бейдж «Организатор»)
        organization_name:
          type: string
          description: От имени какой организации отвечает организатор
        body:
          type: string
          description: Пусто для скрытого сообщения (кроме админа)
        status: { type: string, enum: [visible, hidden] }
        hidden_reason: { type: string }
        created_at: { type: string, format: date-time }
    Organization:
      type: object
      required:
        [
          id,
          name,
          description,
          city,
          contacts,
          sports,
          status,
          review_reason,
          events_count,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Шахматный клуб «Ладья» }
        description: { type: string }
        city: { type: string }
        contacts: { type: string }
        sports:
          type: array
          items:
            $ref: '#/components/schemas/Sport'
        status:
          type: string
          enum: [pending, approved, rejected]
          description: 'pending — на рассмотрении; approved — допущена; rejected — отклонена'
        review_reason:
          type: string
          description: Причина отказа (видят представитель и админ)
        reviewed_at: { type: string, format: date-time, nullable: true }
        owner:
          $ref: '#/components/schemas/Person'
        events_count:
          type: integer
          description: Ближайших опубликованных мероприятий
        created_at: { type: string, format: date-time }
    OrganizationPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    OrganizationInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 3000 }
        city: { type: string, maxLength: 100 }
        contacts: { type: string, maxLength: 500 }
        sport_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    Profile:
      type: object
      required: [id, name, about, city, level, events]
      properties:
        id: { type: string }
        name: { type: string }
        about: { type: string }
        city: { type: string }
        level: { type: string }
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    CompanyRequestInput:
      type: object
      description: Направление — `sport_id` из справочника или `sport_name` (своё). Пустые списки времени и дней — «когда угодно».
      properties:
        sport_id: { type: string, format: uuid }
        sport_name: { type: string, minLength: 2, maxLength: 60 }
        level:
          type: string
          enum: [any, beginner, amateur, pro]
          default: any
          description: Мой уровень; any — не важно
        day_parts:
          type: array
          items: { type: string, enum: [morning, day, evening] }
          description: 'Утро — до 12:00, день — до 17:00, вечер — позже (по Красноярску)'
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: 1 — понедельник … 7 — воскресенье
        area:
          {
            type: string,
            maxLength: 200,
            description: Район словами — для человека,
            в подборе не участвует,
          }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        radius_km:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          description: Только вместе с точкой
        note: { type: string, maxLength: 500 }
    CompanyRequest:
      type: object
      required:
        [
          id,
          sport,
          level,
          day_parts,
          weekdays,
          area,
          lat,
          lng,
          radius_km,
          note,
          status,
          expires_at,
          created_at,
          matches_count,
          others_count,
        ]
      properties:
        id: { type: string, format: uuid }
        sport:
          $ref: '#/components/schemas/Sport'
        level:
          type: string
          enum: [any, beginner, amateur, pro]
        day_parts:
          type: array
          items: { type: string, enum: [morning, day, evening] }
        weekdays:
          type: array
          items: { type: integer }
        area: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        radius_km: { type: integer, nullable: true }
        note: { type: string }
        status:
          type: string
          enum: [active, closed, expired]
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        matches_count:
          type: integer
          description: Подходящие предстоящие события
        others_count:
          type: integer
          description: Сколько ещё людей ищут компанию на это направление (без имён)
    Demand:
      type: object
      required: [sport_id, count, by_day_part, by_weekday]
      properties:
        sport_id: { type: string, format: uuid, nullable: true }
        count: { type: integer }
        by_day_part:
          type: object
          required: [morning, day, evening]
          properties:
            morning: { type: integer }
            day: { type: integer }
            evening: { type: integer }
        by_weekday:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: integer }
          description: С понедельника по воскресенье
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Причина решения — её увидит другая сторона
  responses:
    BadRequest:
      description: Некорректные входные данные (код ошибки и понятное сообщение в теле)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_body
              message: Ожидается JSON с полем title
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unauthorized:
      description: Пользователь не вошёл или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Войдите, чтобы продолжить
    Forbidden:
      description: Нет прав (нужна другая роль) или запрос пришёл с чужого адреса (Origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия
    NotFound:
      description: Запись не найдена или принадлежит другому пользователю (не различаются намеренно)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Задача не найдена
    TooManyRequests:
      description:
        'Превышен лимит: 60 изменяющих запросов в минуту на пользователя (для ИИ — 10 в минуту).
        Заголовок `Retry-After` подсказывает, через сколько секунд повторить.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд можно повторить
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit
              message: Слишком много запросов. Подождите минуту
    InternalError:
      description: Внутренняя ошибка; подробности — в логах по request_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Не удалось выполнить операцию
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unavailable:
      description: Зависимость временно недоступна (база, хранилище, Redis, модель) — повторите позже
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: cache_unavailable
              message: Попробуйте ещё раз позже
    Conflict:
      description:
        Действие сейчас невозможно (снятое или прошедшее событие, нет мест, заявка уже рассмотрена,
        заявка организации уже подана) — сообщение объясняет причину
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: 'Мероприятие недоступно для записи: оно снято с публикации или отменено'
    ValidationError:
      description: Поле формы заполнено неверно; `field` — какое поле подсветить. `reason_required` — нужна причина
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите дату и время в будущем
              field: starts_at
