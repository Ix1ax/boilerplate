      description: |
        Только участник переписки и только на сообщение собеседника (своё — 409). Посторонним — 404.
        Админ увидит **только это сообщение**, а не переписку: ленты чатов в админке нет.
        У жалобы нет мероприятия (`event_id: null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
            example:
              reason: offensive
      responses:
        '201':
          description: Жалоба принята
          content:
