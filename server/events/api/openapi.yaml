      summary: Пожаловаться на отзыв
      description: |
        Жаловаться можно на видимый отзыв (не скрытый, мероприятие опубликовано), но не на свой (409).
        Жалоба привязана к мероприятию отзыва: админ видит его в очереди. Повтор открытой жалобы — 409,
        больше 20 жалоб в час — 429.
      requestBody:
        required: true
