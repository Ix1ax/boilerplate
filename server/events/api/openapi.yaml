# Спецификация API сервиса events — источник правды для его маршрутов.
# После правок: make openapi (соберёт общий packages/contracts/openapi.yaml и TS-типы).
# Пути указаны так, как их видит клиент через gateway (/api/v1/...).
openapi: 3.0.3
info:
  title: Спортивные активности (events)
  version: 0.1.0
  description: |
    Домен кейса «Платформа совместных спортивных активностей»: справочник направлений,
    организации с допуском администратором, мероприятия с двумя режимами записи, заявки
    участников и обсуждение. Модель данных — docs/data-model.md.

    **Роли.** Пользователь ищет, записывается, задаёт вопросы и создаёт свои события.
    Представитель организации подаёт заявку на допуск и после одобрения публикует события
    от её имени — сразу, без повторной модерации. Администратор (`admin`) допускает
    организации, снимает события и скрывает сообщения, но **не** решает заявки участников:
    это делает организатор события.

    **Режимы записи.** `open` — запись сразу подтверждена (`confirmed`), при заполненном лимите —
    лист ожидания (`waitlist`), освободившееся место получает первый из листа. `request` — заявка
    `pending`, организатор принимает (`confirmed`) или отклоняет (`rejected`).

    **Статусы события.** `published` → `unpublished` | `deleted` (админ, с причиной) |
    `cancelled` (организатор, с причиной); `unpublished` → `published` (админ вернул).
    На неопубликованное событие нельзя записаться, в том числе по прямой ссылке (409).
    Уже записавшиеся видят событие с плашкой и причиной.

    **Уведомления.** Решения (заявка, допуск, снятие), новые вопросы и ответы уходят
    в колокольчик и MAX через событие `notification.requested`.
servers:
  - url: /
    description: Через gateway на том же origin (в Docker — Nginx на :3000)
security:
  - keycloak:
      - openid
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Мероприятия
    description: Выдача, карточка и создание мероприятий; отмена организатором.
  - name: Запись
    description: Запись и заявки участников; решения по заявкам принимает организатор.
  - name: Обсуждение
    description: Вопросы и ответы под мероприятием. Ответ организатора помечен.
  - name: Организации
    description: Заявка на допуск, каталог и страницы допущенных организаций.
  - name: Профили и справочники
    description: Направления спорта и публичные профили организаторов.
  - name: Ищу компанию
    description: Запросы людей, которым не с кем заниматься, подбор подходящих событий и обезличенный спрос для организаторов.
  - name: Модерация (админ)
    description: Допуск организаций, снятие мероприятий, скрытие сообщений. Только роль `admin`.
paths:
  /api/v1/sports:
    get:
      tags: [Профили и справочники]
      operationId: listSports
      summary: Справочник направлений
      description:
        Базовые направления и добавленные пользователями (`is_custom`). Своё направление
        появляется здесь сразу после создания события с `sport_name` — правка кода не нужна.
      responses:
        '200':
          description: Направления, сначала базовые
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sport'
              example:
                items:
                  - id: 9b2f6a1e-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    name: Шахматы
                    is_custom: false
                  - id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
                    name: Алтимат-фрисби
                    is_custom: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sports/demand:
    get:
      tags: [Ищу компанию]
      operationId: getDemand
      summary: Спрос на направление
      description:
        Для формы создания события — «12 человек ищут компанию на бег, чаще утром в выходные».
        Только числа, без имён. Считаются чужие активные запросы с совместимым уровнем; человек без
        предпочтений по времени учитывается в каждой части дня и каждом дне. Направление, которого ещё
        нет в справочнике, — нулевой спрос и пустой `sport_id`.
      parameters:
        - name: sport_id
          in: query
          schema: { type: string, format: uuid }
        - name: sport_name
          in: query
          description: Своё направление, если его выбирают не из справочника
          schema: { type: string, maxLength: 60 }
          example: Бег
        - name: level
          in: query
          schema:
            type: string
            enum: [any, beginner, amateur, pro]
            default: any
      responses:
        '200':
          description: Спрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
              example:
                sport_id: 3f1c7c2e-6d5a-4c3e-9a51-0b2d9e1f4a10
                count: 4
                by_day_part: { morning: 3, day: 1, evening: 2 }
                by_weekday: [1, 1, 1, 1, 1, 4, 3]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events:
    get:
      tags: [Мероприятия]
      operationId: listEvents
      summary: Выдача мероприятий
      description:
        Только опубликованные и ещё не закончившиеся, ближайшие первыми. Поиск `q`
        учитывает словоформы и ищет также по названию направления и организации.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Текстовый поиск (до 100 символов)
          schema: { type: string, maxLength: 100 }
          example: фрисби
        - name: sport
          in: query
          description: Направления — UUID через запятую
          schema: { type: string }
        - name: mode
          in: query
          description: Режим записи
          schema: { type: string, enum: [open, request] }
        - name: level
          in: query
          description: Уровень; `beginner` показывает и события «для всех»
          schema: { type: string, enum: [any, beginner, amateur, pro] }
        - name: from
          in: query
          description: Начало не раньше (дата `2026-10-20` или RFC 3339)
          schema: { type: string }
        - name: to
          in: query
          description: Начало раньше (дата или RFC 3339)
          schema: { type: string }
        - name: organization
          in: query
          description: Только события организации (UUID)
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Страница мероприятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Мероприятия]
      operationId: createEvent
      summary: Создать мероприятие
      description:
        Публикуется сразу. `as_organization=true` — от имени своей организации; если она
        ещё не допущена, ответ 403 (проверка на сервере). Направление — `sport_id` из справочника
        или `sport_name` (своё, будет добавлено в справочник).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
            example:
              title: Фрисби в парке
              description: Учимся бросать диск и играем 5 на 5. Новичкам всё объясним.
              sport_name: Алтимат-фрисби
              starts_at: 2026-10-25T10:00:00+07:00
              ends_at: 2026-10-25T12:00:00+07:00
              location: Красноярск, остров Татышев, у центральной поляны
              level: beginner
              requirements: Удобная обувь, вода. Диски есть у организатора.
              price_note: Бесплатно
              private_info: 'Встречаемся у синего шатра, телефон организатора: +7 900 000-00-00'
              join_mode: open
              capacity: 14
              as_organization: false
      responses:
        '201':
          description: Мероприятие опубликовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Организация ещё не допущена администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: 'Организация ещё не допущена администратором: публиковать события от её имени пока нельзя'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Мероприятия]
      operationId: getEvent
      summary: Карточка мероприятия
      description:
        Опубликованное видят все. Снятое, удалённое или отменённое — организатор, записавшиеся
        (с причиной в `moderation_reason`) и админ; остальным — 404. `private_info` заполнено только
        для организатора, подтверждённых участников и админа.
      responses:
        '200':
          description: Мероприятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [Мероприятия]
      operationId: cancelEvent
      summary: Отменить своё мероприятие
      description: Только организатор. Причина обязательна — её увидят записавшиеся, им уйдёт уведомление.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Площадку закрыли на ремонт, перенесём на следующую неделю
      responses:
        '200':
          description: Мероприятие отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/join:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [Запись]
      operationId: joinEvent
      summary: Записаться или подать заявку
      description:
        '`open` — сразу `confirmed` (или `waitlist`, если мест нет); `request` — `pending`.
        Повторный вызов возвращает текущую запись. После отказа или отмены можно записаться снова.
        Неопубликованное или прошедшее событие и собственное событие — 409.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
                  description: Сообщение организатору к заявке
            example:
              message: Играю два года, есть своя доска
      responses:
        '200':
          description: Текущая запись пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyParticipation'
              example:
                id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                status: pending
                decision_reason: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Запись]
      operationId: leaveEvent
      summary: Отменить запись или заявку
      description: Освободившееся место при свободной записи сразу получает первый из листа ожидания.
      responses:
        '204':
          description: Запись отменена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Запись]
      operationId: listParticipants
      summary: Участники и заявки
      description:
        Организатор и админ видят все записи (сначала ожидающие решения) с сообщениями к заявкам.
        Остальные — только подтверждённых участников по имени («кто собирается»).
      responses:
        '200':
          description: Список записей
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/participants/{pid}/approve:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/ParticipationID'
    post:
      tags: [Запись]
      operationId: approveParticipant
      summary: Принять заявку
      description:
        Только организатор события (админ — нет). Заявка должна быть `pending`;
        при заполненном лимите мест — 409. Участник получит уведомление.
      responses:
        '200':
          description: Заявка принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/participants/{pid}/reject:
    parameters:
      - $ref: '#/components/parameters/ID'
      - $ref: '#/components/parameters/ParticipationID'
    post:
      tags: [Запись]
      operationId: rejectParticipant
      summary: Отклонить заявку
      description: Только организатор события. Комментарий необязателен, участник его увидит.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Турнир для игроков с рейтингом от 1400
      responses:
        '200':
          description: Заявка отклонена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Обсуждение]
      operationId: listComments
      summary: Обсуждение мероприятия
      description:
        Сообщения по времени. Скрытые модератором показываются пометкой без текста
        (текст видит только админ).
      responses:
        '200':
          description: Сообщения
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Обсуждение]
      operationId: addComment
      summary: Задать вопрос или ответить
      description:
        Писать может любой вошедший пользователь, пока событие опубликовано. `parent_id` —
        ответ на сообщение верхнего уровня. Организатор получает уведомление о вопросе, автор вопроса —
        об ответе; открытые страницы обновляются через WebSocket-канал `room:event:{id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
            example:
              body: Нужна ли своя доска?
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/participations:
    get:
      tags: [Запись]
      operationId: listMyParticipations
      summary: Мои записи
      description: Все записи и заявки пользователя со статусом и кратким описанием события; будущие первыми.
      responses:
        '200':
          description: Записи
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/events:
    get:
      tags: [Мероприятия]
      operationId: listMyEvents
      summary: Мои мероприятия (как организатор)
      description: Все статусы, в том числе снятые и отменённые — с причиной.
      responses:
        '200':
          description: Мероприятия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/organization:
    get:
      tags: [Организации]
      operationId: getMyOrganization
      summary: Моя организация и статус заявки
      description: Представитель видит заявку в любом статусе и причину отказа. 404 — заявки ещё нет.
      responses:
        '200':
          description: Организация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Организации]
      operationId: submitOrganization
      summary: Подать заявку организации
      description:
        Создаёт профиль со статусом `pending`. До одобрения администратором публиковать
        события от имени организации нельзя. Одна организация на представителя (повтор — 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              name: Клуб скандинавской ходьбы «Сосны»
              description: Тренировки по выходным для всех возрастов, палки выдаём.
              city: Красноярск
              contacts: '@sosny_walk, +7 900 000-00-01'
              sport_ids: []
      responses:
        '201':
          description: Заявка подана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Организации]
      operationId: updateMyOrganization
      summary: Исправить профиль организации
      description:
        После отказа правка означает повторную подачу — статус снова `pending`.
        Допущенная организация остаётся допущенной.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Профиль сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/company-requests:
    get:
      tags: [Ищу компанию]
      operationId: listMyCompanyRequests
      summary: Мои запросы «Ищу компанию»
      description: Активные первыми. Истёкший запрос (старше 30 дней) возвращается со статусом `expired` и уведомлений больше не присылает.
      responses:
        '200':
          description: Запросы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Ищу компанию]
      operationId: createCompanyRequest
      summary: Ищу компанию
      description:
        Человек описывает, чем и когда хочет заниматься. Уже опубликованные подходящие события
        сразу попадают в подборку (`matches_count`, `GET …/matches`). Когда кто-то опубликует новое
        подходящее событие, придёт уведомление «Нашлась компания». Подходит, если совпадает
        направление, уровень совместим («не важно» с любой стороны или точное совпадение), время суток
        и день недели — по местному времени события, а при заданной точке — событие в радиусе.
        Один активный запрос на направление (повтор — 409). Своё направление заводится в справочнике.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequestInput'
            example:
              sport_name: Бег
              level: beginner
              day_parts: [morning]
              weekdays: [6, 7]
              area: Рядом с Октябрьским районом
              lat: 56.0153
              lng: 92.8932
              radius_km: 5
              note: Бегаю 3–5 км, хочу компанию, чтобы не бросить
      responses:
        '201':
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/company-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Ищу компанию]
      operationId: getMyCompanyRequest
      summary: Мой запрос «Ищу компанию»
      responses:
        '200':
          description: Запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Ищу компанию]
      operationId: closeCompanyRequest
      summary: Закрыть запрос
      description: «Нашёл компанию» или «больше не ищу» — уведомления прекращаются. Уже закрытый или чужой запрос — 404.
      responses:
        '204':
          description: Запрос закрыт
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/company-requests/{id}/matches:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Ищу компанию]
      operationId: listCompanyMatches
      summary: Подобранные события
      description: Предстоящие опубликованные события, подобранные под запрос, — ближайшие первыми. Снятые и прошедшие сюда не попадают.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/organizations:
    get:
      tags: [Организации]
      operationId: listOrganizations
      summary: Каталог организаций
      description: Только допущенные администратором, по алфавиту.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Поиск по названию, описанию и городу
          schema: { type: string }
      responses:
        '200':
          description: Организации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Организации]
      operationId: getOrganization
      summary: Страница организации и её мероприятия
      description: Публична только после допуска; представитель и админ видят её в любом статусе.
      responses:
        '200':
          description: Организация и ближайшие опубликованные события
          content:
            application/json:
              schema:
                type: object
