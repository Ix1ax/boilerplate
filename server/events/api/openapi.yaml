        level:
          type: string
          enum:
            - any
            - beginner
            - amateur
            - pro
        city:
          type: string
          maxLength: 100
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        day_parts:
          type: array
          items:
            type: string
            enum:
              - morning
              - day
              - evening
        lat:
          type:
            - number
            - 'null'
          minimum: -90
          maximum: 90
        lng:
          type:
            - number
            - 'null'
          minimum: -180
          maximum: 180
        radius_km:
          type: integer
          minimum: 1
          maximum: 100
    RecommendedEvent:
      type: object
      required:
        - event
        - reasons
      properties:
        event:
          $ref: '#/components/schemas/Event'
        reasons:
          type: array
          items:
            type: string
    RecommendationPage:
      type: object
      required:
        - items
        - personalized
        - algorithm
        - generated_at
        - has_more
        - next_offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedEvent'
        personalized:
          type: boolean
        algorithm:
          type: string
        generated_at:
          type: string
          format: date-time
        has_more:
          type: boolean
        next_offset:
          type: integer
          minimum: 0
    RecommendationFeedback:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - view
            - interested
            - dismiss
            - reset
    Achievement:
      type: object
      required:
        - code
        - title
        - description
        - current
        - target
        - points
        - earned
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
        current:
          type: integer
          minimum: 0
        target:
          type: integer
          minimum: 1
        points:
          type: integer
          minimum: 0
        earned:
          type: boolean
    PersonalProgress:
      type: object
      required:
        - points
        - title
        - next_title_at
        - achievements
        - note
      properties:
        points:
          type: integer
          minimum: 0
        title:
          type: string
        next_title_at:
          type: integer
          minimum: 0
        achievements:
          type: array
          items:
            $ref: '#/components/schemas/Achievement'
        note:
          type: string
  responses:
    BadRequest:
      description: Некорректные входные данные (код ошибки и понятное сообщение в теле)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_body
              message: Ожидается JSON с полем title
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unauthorized:
      description: Пользователь не вошёл или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Войдите, чтобы продолжить
    Forbidden:
      description: Нет прав (нужна другая роль) или запрос пришёл с чужого адреса (Origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия
    NotFound:
      description: Запись не найдена или принадлежит другому пользователю (не различаются намеренно)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Задача не найдена
    TooManyRequests:
      description:
        'Превышен лимит: 60 изменяющих запросов в минуту на пользователя (для ИИ — 10 в минуту).
        Заголовок `Retry-After` подсказывает, через сколько секунд повторить.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд можно повторить
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit
              message: Слишком много запросов. Подождите минуту
    InternalError:
      description: Внутренняя ошибка; подробности — в логах по request_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Не удалось выполнить операцию
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unavailable:
      description: Зависимость временно недоступна (база, хранилище, Redis, модель) — повторите позже
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: cache_unavailable
              message: Попробуйте ещё раз позже
    Conflict:
      description:
        Действие сейчас невозможно (снятое или прошедшее событие, нет мест, заявка уже рассмотрена,
        заявка организации уже подана) — сообщение объясняет причину
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: 'Мероприятие недоступно для записи: оно снято с публикации или отменено'
    ValidationError:
      description: Поле формы заполнено неверно; `field` — какое поле подсветить. `reason_required` — нужна причина
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите дату и время в будущем
              field: starts_at
