        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Обсуждение
      operationId: listComments
      summary: Обсуждение мероприятия
      description: Сообщения по времени. Скрытые модератором показываются пометкой без текста (текст видит админ — `GET /api/v1/admin/events/{id}/comments`).
      responses:
        '200':
          description: Сообщения
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Обсуждение
      operationId: addComment
      summary: Задать вопрос или ответить
      description:
        Писать может любой вошедший пользователь, пока событие опубликовано. `parent_id` — ответ на
        сообщение верхнего уровня. Организатор получает уведомление о вопросе, автор вопроса — об ответе;
        открытые страницы обновляются через WebSocket-канал `room:event:{id}`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
            example:
              body: Нужна ли своя доска?
      responses:
        '201':
          description: Сообщение добавлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
