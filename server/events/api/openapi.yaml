      operationId: reportEvent
      summary: Пожаловаться на мероприятие
      description: |
        Жалоба уходит в очередь администратора; данные события сама по себе не меняет. Решение
        и пояснение придут уведомлением. Одна открытая жалоба человека на цель (повтор — 409),
        не больше 20 жалоб в час (429). На своё мероприятие пожаловаться нельзя (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportInput'
