        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/events/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags: [Модерация (админ)]
      operationId: unpublishEvent
      summary: Снять мероприятие с публикации
      description:
        Событие пропадает из выдачи, запись закрывается (в том числе по прямой ссылке).
        Существующие записи сохраняются; организатор и участники видят плашку с причиной и получают уведомление.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Некорректное место проведения
      responses:
        '200':
          description: Мероприятие снято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
