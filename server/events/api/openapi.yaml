    post:
      tags:
        - Events
      summary: Билет в видеокомнату онлайн мероприятия
      description:
        Организатор или подтверждённый участник опубликованного online события. Вход с starts_at минус 15
        минут до ends_at; при отсутствии ends_at — 90 минут после начала. Билет действует до двух минут, без
        прав администратора. Уже подключённого участника истечение JWT не отключает.
      responses:
        '200':
          description: Билет для LiveKit SDK. Не кэшировать и не сохранять в localStorage.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoToken'
        '400':
          description: Невалидный UUID
        '401':
          description: Требуется вход
        '404':
          description: Нет события или права участия
        '409':
          description: Встреча очная
