# Спецификация API сервиса identity — источник правды для его маршрутов.
# После правок: make openapi. Пути указаны так, как их видит клиент через gateway (/api/v1/...).
openapi: 3.0.3
info:
  title: Учётные записи (identity)
  version: 0.1.0
  description: >
    Обычная регистрация по почте и паролю — второй способ входа рядом со «Столото ID» (Keycloak).


    Регистрация, вход, смена пароля и выход — маршруты gateway `/auth/local/*` (описаны в спецификации
    gateway): сессию и cookie выдаёт gateway, а сервис только хранит хеши Argon2id и статус учётной записи.
    Здесь — то, что видит администратор.


    **Защита от подбора.** После 10 неверных паролей подряд вход в учётную запись закрыт на 15 минут (429).


    **Блокировка.** Администратор блокирует учётную запись с причиной; вход по паролю закрывается сразу,
    открытые сессии — в течение 30 секунд.
servers:
  - url: /
    description: Через gateway на том же origin (в Docker — Nginx на :3000)
security:
  - keycloak:
      - openid
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Учётные записи (админ)
    description: 'Пользователи обычной регистрации: поиск, карточка, блокировка. Только для роли admin.'
paths:
  /api/v1/admin/accounts:
    get:
      tags:
        - Учётные записи (админ)
      operationId: listAccounts
      summary: Учётные записи обычной регистрации
      description:
        Поиск по почте и имени среди пользователей, зарегистрированных по почте и паролю. Пользователи
        «Столото ID» живут в Keycloak и здесь не показываются.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Часть почты или имени (до 100 символов)
          schema:
            type: string
            maxLength: 100
          example: anna
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            type: string
            enum:
              - active
              - blocked
      responses:
        '200':
          description: Страница учётных записей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Учётные записи (админ)
      operationId: getAccount
      summary: Карточка учётной записи
      description: Статус, последний вход и история — регистрация, блокировки, смены пароля.
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/accounts/{id}/block:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Учётные записи (админ)
      operationId: blockAccount
      summary: Заблокировать учётную запись
      description:
        Вход по паролю закрывается сразу; уже открытые сессии gateway закрывает при следующей сверке
        статуса (не дольше 30 секунд). Причину пользователь увидит при попытке входа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Массовая рассылка рекламы в обсуждениях
      responses:
        '200':
          description: Заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/accounts/{id}/unblock:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Учётные записи (админ)
      operationId: unblockAccount
      summary: Разблокировать учётную запись
      responses:
        '200':
          description: Разблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: starter_session
      description:
        Сессия браузера. Ставится после входа через `/auth/login`, хранит только случайный идентификатор
        (токены Keycloak лежат на сервере). Изменяющие запросы с cookie дополнительно требуют заголовок
        `Origin`, равный адресу приложения (защита от CSRF).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        'Access token Keycloak для внешних клиентов и тестов. Получить локально: `POST
        http://localhost:8180/realms/hackathon/protocol/openid-connect/token` с `grant_type=password`,
        `client_id=hackathon-cli`, логином и паролем демо-пользователя.'
    keycloak:
      type: oauth2
      description:
        'Вход через Keycloak прямо из Swagger: нажмите Authorize → keycloak → Authorize и войдите
        демо-пользователем (логины и пароли печатает make demo). Отдельный клиент hackathon-swagger с PKCE —
        на вход в приложение не влияет. Адрес Keycloak gateway подставляет из OIDC_ISSUER.'
      flows:
        authorizationCode:
          authorizationUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/auth'
          tokenUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          refreshUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          scopes:
            openid: Вход (OpenID Connect)
            profile: Имя пользователя
            email: Почта
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Идентификатор записи (UUID)
      schema:
        type: string
        format: uuid
      example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
    Limit:
      name: limit
      in: query
      description: Сколько записей вернуть (страница)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить от начала
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
  schemas:
    Error:
      type: object
      description: Единый формат ошибки всех сервисов.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Машинный код ошибки — по нему фронтенд выбирает реакцию
              example: validation_error
            message:
              type: string
              description: Сообщение для человека, на русском
              example: Название должно содержать от 1 до 200 символов
            request_id:
              type: string
              description: Идентификатор запроса — по нему ошибку находят в логах всех сервисов
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Причина решения — её увидит другая сторона
    Account:
      type: object
      description: Учётная запись обычной регистрации (без пароля)
      required:
        - id
        - email
        - name
        - status
        - block_reason
        - roles
        - last_login_at
        - created_at
        - password_changed_at
      properties:
        id:
          type: string
          format: uuid
          description: Тот же идентификатор, что X-User-ID в сервисах
        email:
          type: string
          format: email
          example: anna@example.ru
        name:
          type: string
          example: Анна Смирнова
        status:
          type: string
          enum:
            - active
            - blocked
        block_reason:
          type: string
          description: Причина блокировки; пусто у активной
        roles:
          type: array
          description: Регистрация даёт только роль user — модераторы входят через «Столото ID»
          items:
            type: string
          example:
            - user
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        password_changed_at:
          type: string
          format: date-time
          description: Версия пароля для отзыва серверных сессий
    AccountPage:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        total:
          type: integer
          description: Сколько всего подходит под фильтр
    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          required:
            - history
          properties:
            history:
              type: array
              items:
                type: object
                required:
                  - action
                  - actor
                  - comment
                  - created_at
                properties:
                  action:
                    type: string
                    enum:
                      - registered
                      - blocked
                      - unblocked
                      - password_changed
                  actor:
                    type: string
                    description: self или имя администратора
                  comment:
                    type: string
                  created_at:
                    type: string
                    format: date-time
  responses:
    BadRequest:
      description: Некорректные входные данные (код ошибки и понятное сообщение в теле)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_body
              message: Ожидается JSON с полем title
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unauthorized:
      description: Пользователь не вошёл или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Войдите, чтобы продолжить
    Forbidden:
      description: Нет прав (нужна другая роль) или запрос пришёл с чужого адреса (Origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия
    NotFound:
      description: Запись не найдена или принадлежит другому пользователю (не различаются намеренно)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Задача не найдена
    Conflict:
      description:
        Действие сейчас невозможно (снятое или прошедшее событие, нет мест, заявка уже рассмотрена,
        заявка организации уже подана) — сообщение объясняет причину
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: 'Мероприятие недоступно для записи: оно снято с публикации или отменено'
    ValidationError:
      description: Поле формы заполнено неверно; `field` — какое поле подсветить. `reason_required` — нужна причина
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите дату и время в будущем
              field: starts_at
    InternalError:
      description: Внутренняя ошибка; подробности — в логах по request_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Не удалось выполнить операцию
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
