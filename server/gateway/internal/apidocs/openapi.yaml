          nullable: true
        author:
          $ref: '#/components/schemas/Person'
        is_organizer:
          type: boolean
          description: Автор — организатор события (бейдж «Организатор»)
        organization_name:
          type: string
          description: От имени какой организации отвечает организатор
        body:
          type: string
          description: Пусто для скрытого сообщения (кроме админа)
        status:
          type: string
          enum:
            - visible
            - hidden
        hidden_reason:
          type: string
        created_at:
          type: string
          format: date-time
    Organization:
      type: object
