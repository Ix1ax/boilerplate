      summary: Вернуть снятое мероприятие в публикацию
      responses:
        '200':
          description: Мероприятие снова опубликовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/comments/{id}/hide:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Модерация (админ)
      operationId: hideComment
      summary: Скрыть сообщение
      description:
        Скрывается одно сообщение; мероприятие и остальное обсуждение остаются. Автор получит уведомление
        с причиной.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Реклама стороннего сервиса
      responses:
        '200':
          description: Сообщение скрыто
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/files:
    get:
      tags:
        - Файлы
      operationId: listFiles
      summary: Список своих файлов
      description: Новые сверху. С `entity_type` и `entity_id` — только файлы, приложенные к этой записи.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: entity_type
          in: query
          description: Тип записи (латиница и «_»), указывается вместе с entity_id
          schema:
            type: string
            pattern: ^[a-z][a-z_]{0,29}$
          example: application
        - name: entity_id
          in: query
          description: Идентификатор записи
          schema:
            type: string
            pattern: ^[A-Za-z0-9-]{1,64}$
          example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
      responses:
        '200':
          description: Страница файлов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
              example:
                items:
                  - id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    name: устав.pdf
                    size: 182044
                    content_type: application/pdf
                    created_at: 2026-10-18T09:40:00Z
                    entity:
                      type: application
                      id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                total: 1
                limit: 20
                offset: 0
        '400':
          description:
            '`invalid_pagination` или `invalid_entity` (заполнена только одна часть привязки или неверный
            формат)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Файлы
      operationId: uploadFile
      summary: Загрузить файл
      description: Отправьте multipart/form-data с полем `file`; для привязки к записи — ещё `entity_type` и `entity_id`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл до 10 МиБ
                entity_type:
                  type: string
                  pattern: ^[a-z][a-z_]{0,29}$
                  description: Тип записи, к которой приложить файл
                entity_id:
                  type: string
                  pattern: ^[A-Za-z0-9-]{1,64}$
                  description: Идентификатор записи
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: '`invalid_body` (нет поля file, пустой файл, недопустимое имя) или `invalid_entity`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Файл больше 10 МиБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: payload_too_large
                  message: Файл превышает 10 МиБ или запрос имеет неверный формат
        '415':
          description: Тип содержимого не разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unsupported_type
                  message: Можно загрузить PNG, JPEG, WebP, PDF или текстовый файл
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Файлы
      operationId: downloadFile
      summary: Скачать файл
      description:
        'Отдаётся как вложение (`Content-Disposition: attachment`) с исходным именем; браузер не
        исполняет содержимое.'
      responses:
        '200':
          description: Содержимое файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
        - Файлы
      operationId: deleteFile
      summary: Удалить файл
      description: Удаляет содержимое из S3, затем метаданные. Если S3 недоступно — 503, повтор безопасен.
      responses:
        '204':
          description: Файл удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/llm/status:
    get:
      tags:
        - Модель
      operationId: getLlmStatus
      summary: Состояние модели
      responses:
        '200':
          description: Доступна ли Ollama и скачана ли модель
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - model
                  - model_installed
                properties:
                  available:
                    type: boolean
                    description: Ollama отвечает
                  model:
                    type: string
                  model_installed:
                    type: boolean
                    description: Нужная модель скачана
              example:
                available: true
                model: qwen2.5:1.5b
                model_installed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/llm/generate:
    post:
      tags:
        - Модель
      operationId: generate
      summary: Ответ модели целиком
      description: Ждёт полный ответ (до нескольких десятков секунд на CPU). Для чата удобнее поток — /llm/stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmPrompt'
            examples:
              text:
                summary: Обычный ответ
                value:
                  prompt: Придумай название для волонтёрского проекта
              json:
                summary: Структурированный ответ
                value:
                  system: 'Ответь JSON: {"title": string}'
                  prompt: Придумай название
                  json: true
                  temperature: 0.2
      responses:
        '200':
          description: Ответ модели
          content:
            application/json:
              schema:
                type: object
                required:
                  - text
                  - model
                properties:
                  text:
                    type: string
                  model:
                    type: string
              example:
                text: «Доброе дело рядом»
                model: qwen2.5:1.5b
        '400':
          description: Пустой запрос, слишком длинный или неверная temperature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Запрос должен содержать от 1 до заданного предела символов
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Лимит запросов (`rate_limit`) или модель занята (`model_busy`, повторите через несколько секунд)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: model_busy
                  message: Модель занята, повторите через несколько секунд
        '503':
          description: Модель не запущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: model_unavailable
                  message: Модель недоступна. Запустите её командой make llm
  /api/v1/llm/stream:
    post:
      tags:
        - Модель
      operationId: generateStream
      summary: Ответ модели потоком (SSE)
      description: |
        Текст приходит по частям, пока модель генерирует: события `data: {"t": "фрагмент"}`,
        в конце `event: done`, при сбое посреди ответа — `event: error`. Ошибки до начала потока
        (400, 429, 503) приходят обычным JSON, как у /llm/generate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmPrompt'
            example:
              prompt: Объясни в двух предложениях, что такое волонтёрство
      responses:
        '200':
          description: Поток фрагментов
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                data: {"t":"Волонтёрство — "}

                data: {"t":"это добровольная помощь…"}

                event: done
                data: {}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/notifications:
    get:
      tags:
        - Уведомления
      operationId: listNotifications
      summary: Мои уведомления
      description: Новые сверху; `unread` — сколько непрочитанных всего (для значка на колокольчике).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
              example:
                items:
                  - id: 5d1c0b9a-8e7f-4a6b-9c5d-4e3f2a1b0c9d
                    title: 'ИИ-проверка: задача требует внимания'
                    body: Откройте задачу, чтобы посмотреть рекомендацию. Решение остаётся за вами.
                    link: /dashboard/tasks
                    created_at: 2026-10-18T09:30:05Z
                    read_at: null
                total: 1
                unread: 1
                limit: 20
                offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/notifications/stream:
    get:
      tags:
        - Уведомления
      operationId: streamNotifications
      summary: Живой поток новых уведомлений (SSE)
      description: |
        Server-Sent Events: в браузере — `new EventSource('/api/v1/notifications/stream')`.
        При новом уведомлении приходит событие `notification` с JSON уведомления. Каждые 25 секунд —
        комментарий-пинг, чтобы прокси не закрыл соединение. Через 2 минуты сервер закрывает поток,
        EventSource переподключается сам.
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
              example: >+
                event: notification

                data: {"id":"5d1c…","title":"ИИ-проверка: замечаний
                нет","body":"…","link":"/dashboard/tasks","created_at":"2026-10-18T09:30:05Z","read_at":null}

        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Уведомления
      operationId: markNotificationRead
      summary: Отметить прочитанным
      responses:
        '204':
          description: Отмечено (повторная отметка тоже 204)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/notifications/read-all:
    post:
      tags:
        - Уведомления
      operationId: markAllNotificationsRead
      summary: Прочитать все
      responses:
        '204':
          description: Все уведомления отмечены прочитанными
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/max:
    get:
      tags:
        - Мессенджер MAX
      operationId: getMaxStatus
      summary: Подключён ли MAX
      description:
        '`enabled` — настроен ли бот на сервере (если нет — кнопку подключения не показывают), `linked` —
        подключил ли его этот пользователь.'
      responses:
        '200':
          description: Статус
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaxStatus'
              example:
                enabled: true
                linked: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Мессенджер MAX
      operationId: unlinkMax
      summary: Отключить уведомления в MAX
      responses:
        '204':
          description: Отключено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Бот MAX не настроен на сервере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: max_disabled
                  message: Уведомления в MAX не настроены
  /api/v1/notifications/max/link:
    post:
      tags:
        - Мессенджер MAX
      operationId: createMaxLink
      summary: Получить ссылку подключения MAX
      description:
        Одноразовая ссылка `https://max.ru/<бот>?start=<код>` на 10 минут. Пользователь открывает её,
        нажимает «Начать» в MAX — бот получает код и связывает аккаунты. Отключить — `/stop` в боте.
      responses:
        '200':
          description: Ссылка
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
              example:
                url: https://max.ru/demo_bot?start=Zk3x9QpL2mN7vR1sT4uW8yB0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Бот MAX не настроен на сервере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/ws:
    get:
      tags:
        - Realtime
      operationId: websocket
      summary: Подключиться по WebSocket
      description:
        Upgrade до WebSocket. Для входа по cookie браузер должен прислать `Origin` приложения — это
        защита от подключения с чужого сайта.
      responses:
        '101':
          description: Протокол переключён на WebSocket
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tasks:
    get:
      tags:
        - Задачи
      operationId: listTasks
      summary: Список своих задач
      description:
        Страница задач текущего пользователя с фильтром по статусу, поиском по названию и сортировкой.
        `total` — сколько всего задач подходит под фильтр (для пагинации).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          description: Фильтр по статусу; несколько — через запятую
          schema:
            type: string
          example: todo,in_progress
        - name: q
          in: query
          description: Поиск по подстроке в названии (без учёта регистра)
          schema:
            type: string
            maxLength: 100
          example: демо
        - name: sort
          in: query
          description: Поле сортировки — `created`, `title` или `status`; минус в начале — по убыванию
          schema:
            type: string
            default: -created
          example: title
      responses:
        '200':
          description: Страница задач
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
              example:
                items:
                  - id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                    title: Подготовить демо для жюри
                    status: in_progress
                    created_at: 2026-10-18T09:30:00Z
                    moderation:
                      verdict: ok
                      source: rules+llm
                      checked_at: 2026-10-18T09:30:04Z
                total: 1
                limit: 20
                offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Задачи
      operationId: createTask
      summary: Создать задачу
      description:
        Создаёт задачу в статусе `draft`. В той же транзакции ставится событие `task.created` — оно
        запустит ИИ-проверку и уведомление владельцу.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
            example:
              title: Подготовить демо для жюри
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              example:
                id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                title: Подготовить демо для жюри
                status: draft
                created_at: 2026-10-18T09:30:00Z
                moderation: null
        '400':
          description: '`invalid_body` — нет поля title; `validation_error` — пустое или длиннее 200 символов'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Название должно содержать от 1 до 200 символов
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags:
        - Задачи
      operationId: updateTaskStatus
      summary: Сменить статус задачи
      description:
        Переводит задачу в новый статус по правилам переходов (см. описание сервиса) и записывает переход
        в историю. Проверка и запись идут одной транзакцией с блокировкой строки.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
            examples:
              start:
                summary: Взять в работу
                value:
                  status: in_progress
              archive:
                summary: Архивировать (нужен комментарий)
                value:
                  status: archived
                  comment: Больше не актуально
      responses:
        '200':
          description: Статус изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: '`invalid_id`, `invalid_body` (нет status) или `comment_required` (архивация без комментария)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: comment_required
                  message: Укажите комментарий к смене статуса
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Переход из текущего статуса в запрошенный запрещён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_transition
                  message: 'Недопустимая смена статуса: draft → done'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Задачи
      operationId: deleteTask
      summary: Удалить задачу
      responses:
        '204':
          description: Задача удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tasks/{id}/history:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Задачи
      operationId: getTaskHistory
      summary: История статусов задачи
      description: Все переходы статуса от старых к новым — с автором и комментарием. Доступна только владельцу.
      responses:
        '200':
          description: История переходов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskHistoryPage'
              example:
                items:
                  - from: draft
                    to: todo
                    actor: demo@example.test
                    comment: ''
                    created_at: 2026-10-18T09:31:00Z
                  - from: todo
                    to: archived
                    actor: demo@example.test
                    comment: Больше не актуально
                    created_at: 2026-10-18T10:05:00Z
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tasks/{id}/analyze:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - ИИ-проверка
      operationId: analyzeTask
      summary: Проверить задачу сейчас
      description:
        'Ручная проверка (автоматическая запускается после создания). Правила ищут сбор денег, ссылки,
        контакты, капслок и слишком короткий текст и задают вердикт; модель Qwen, если доступна, добавляет
        краткий совет. Если модель недоступна или занята — ответ только по правилам (`source: rules`), это не
        ошибка. Лимит — 10 проверок в минуту.'
      responses:
        '200':
          description: Рекомендация (решение принимает человек)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAnalysis'
              example:
                task_id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                verdict: needs_review
                flags:
                  - code: money
                    message: Похоже на сбор или перевод денег
                advice:
                  summary: В тексте просьба перевести деньги
                  risk: high
                  suggestion: Уточните цель и уберите реквизиты
                source: rules+llm
                decision_required: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/tasks/stats:
    get:
      tags:
        - Отчёты (админ)
      operationId: getTaskStats
      summary: Сводка для дашборда
      description:
        Итоги по всем задачам, разбивка по ИИ-проверке и число созданных задач за последние 14 дней (для
        графика). Все цифры из одного снимка данных.
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStats'
              example:
                total: 42
                completed: 17
                owners: 9
                moderation:
                  ok: 30
                  needs_review: 4
                  unchecked: 8
                by_day:
                  - date: 2026-10-17
                    count: 5
                  - date: 2026-10-18
                    count: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/tasks/export.csv:
    get:
      tags:
        - Отчёты (админ)
      operationId: exportTasksCsv
      summary: Выгрузка всех задач в CSV
      description:
        'Файл для Excel: UTF-8 с BOM, разделитель «;», ячейки, похожие на формулы, экранируются. Колонки:
        ID, Владелец, Название, Статус, Создана, Проверка ИИ, Источник проверки.'
      responses:
        '200':
          description: CSV-файл (скачивается как tasks-ГГГГ-ММ-ДД.csv)
          content:
            text/csv:
              schema:
                type: string
              example: |
                ID;Владелец;Название;Статус;Создана;Проверка ИИ;Источник проверки
                3f6c…;a1b2…;Подготовить демо;done;2026-10-18T09:30:00Z;замечаний нет;rules+llm
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: starter_session
      description:
        Сессия браузера. Ставится после входа через `/auth/login`, хранит только случайный идентификатор
        (токены Keycloak лежат на сервере). Изменяющие запросы с cookie дополнительно требуют заголовок
        `Origin`, равный адресу приложения (защита от CSRF).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        'Access token Keycloak для внешних клиентов и тестов. Получить локально: `POST
        http://localhost:8180/realms/hackathon/protocol/openid-connect/token` с `grant_type=password`,
        `client_id=hackathon-cli`, логином и паролем демо-пользователя.'
    keycloak:
      type: oauth2
      description:
        'Вход через Keycloak прямо из Swagger: нажмите Authorize → keycloak → Authorize и войдите
        демо-пользователем (логины и пароли печатает make demo). Отдельный клиент hackathon-swagger с PKCE —
        на вход в приложение не влияет. Адрес Keycloak gateway подставляет из OIDC_ISSUER.'
      flows:
        authorizationCode:
          authorizationUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/auth'
          tokenUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          refreshUrl: '{{OIDC_ISSUER}}/protocol/openid-connect/token'
          scopes:
            openid: Вход (OpenID Connect)
            profile: Имя пользователя
            email: Почта
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Идентификатор записи (UUID)
      schema:
        type: string
        format: uuid
      example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
    Limit:
      name: limit
      in: query
      description: Сколько записей вернуть (страница)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить от начала
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description:
        'Необязательный ключ защиты от двойной отправки (двойной клик, повтор после обрыва сети). Повтор
        с тем же ключом в течение 24 часов вернёт сохранённый ответ с заголовком `Idempotent-Replayed: true`,
        а не выполнит действие ещё раз.'
      schema:
        type: string
        maxLength: 100
      example: 6f1e2d3c-create-task-1
    ParticipationID:
      name: pid
      in: path
      required: true
      description: Идентификатор записи или заявки (UUID)
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      description: Единый формат ошибки всех сервисов.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Машинный код ошибки — по нему фронтенд выбирает реакцию
              example: validation_error
            message:
              type: string
              description: Сообщение для человека, на русском
              example: Название должно содержать от 1 до 200 символов
            request_id:
              type: string
              description: Идентификатор запроса — по нему ошибку находят в логах всех сервисов
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    User:
      type: object
      description: Пользователь из Keycloak
      required:
        - id
        - email
        - name
        - roles
      properties:
        id:
          type: string
          description: Постоянный идентификатор (sub) — владелец записей во всех сервисах
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          description: Роли Keycloak; доступ проверяется на сервере, на клиенте роли только для интерфейса
          items:
            type: string
            enum:
              - user
              - admin
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
            - unavailable
    AuditRecord:
      type: object
      required:
        - actor
        - actor_email
        - method
        - route
        - path
        - status
        - request_id
        - ip
        - occurred_at
      properties:
        actor:
          type: string
          description: Идентификатор пользователя (sub)
        actor_email:
          type: string
        method:
          type: string
        route:
          type: string
          description: Шаблон маршрута gateway (без значений параметров)
        path:
          type: string
          description: Фактический путь запроса
        status:
          type: integer
          description: Код ответа
        request_id:
          type: string
        ip:
          type: string
        occurred_at:
          type: string
          format: date-time
    AuditPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Sport:
      type: object
      required:
        - id
        - name
        - is_custom
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Шахматы
        is_custom:
          type: boolean
          description: Добавлено пользователем при создании события
    Organizer:
      type: object
      description: 'Кто проводит событие: человек (ссылка /profiles/{id}) или организация (/organizations/{id})'
      required:
        - type
        - id
        - name
      properties:
        type:
          type: string
          enum:
            - user
            - organization
        id:
          type: string
        name:
          type: string
          example: Шахматный клуб «Ладья»
    MyParticipation:
      type: object
      description: Запись текущего пользователя
      required:
        - id
        - status
        - decision_reason
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - confirmed
            - pending
            - rejected
            - cancelled
            - waitlist
          description:
            confirmed — участвует; pending — ждёт решения организатора; rejected — отказ; cancelled — отменил
            сам; waitlist — лист ожидания
        decision_reason:
          type: string
          description: Комментарий организатора при отказе
    Event:
      type: object
      required:
        - id
        - title
        - description
        - sport
        - starts_at
        - location
        - level
        - requirements
        - price_note
        - private_info
        - has_private_info
        - join_mode
        - confirmed_count
        - pending_count
        - waitlist_count
        - status
        - moderation_reason
        - organizer
        - is_organizer
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Шахматный турнир выходного дня
        description:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          example: Красноярск, ул. Мира, 10, библиотека, 2 этаж
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        level:
          type: string
          enum:
            - any
            - beginner
            - amateur
            - pro
          description: Для кого подходит
        requirements:
          type: string
          description: Подготовка, инвентарь, форма
        price_note:
          type: string
          example: Бесплатно
        private_info:
          type: string
          description: Точка сбора и контакты. Заполнено только для организатора, подтверждённых участников и админа
        has_private_info:
          type: boolean
          description: Есть закрытая информация — клиент может подсказать «откроется после подтверждения»
        join_mode:
          type: string
          enum:
            - open
            - request
          description: open — свободная запись; request — по заявке с подтверждением
        capacity:
          type: integer
          nullable: true
          description: Лимит мест; null — без лимита
        confirmed_count:
          type: integer
        pending_count:
          type: integer
        waitlist_count:
          type: integer
        status:
          type: string
          enum:
            - published
            - unpublished
            - deleted
            - cancelled
        moderation_reason:
          type: string
          description: Причина снятия, удаления или отмены
        organizer:
          $ref: '#/components/schemas/Organizer'
        is_organizer:
          type: boolean
          description: Текущий пользователь — организатор
        my_participation:
          allOf:
            - $ref: '#/components/schemas/MyParticipation'
          nullable: true
        created_at:
          type: string
          format: date-time
    EventPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    EventInput:
      type: object
      required:
        - title
        - starts_at
        - location
        - join_mode
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        sport_id:
          type: string
          format: uuid
          description: Направление из справочника
        sport_name:
          type: string
          minLength: 2
          maxLength: 60
          description: Своё направление, если sport_id не задан
        starts_at:
          type: string
          format: date-time
          description: В будущем
        ends_at:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          minLength: 3
          maxLength: 300
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        level:
          type: string
          enum:
            - any
            - beginner
            - amateur
            - pro
          default: any
        requirements:
          type: string
          maxLength: 2000
        price_note:
          type: string
          maxLength: 200
        private_info:
          type: string
          maxLength: 2000
        join_mode:
          type: string
          enum:
            - open
            - request
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        as_organization:
          type: boolean
          default: false
          description: От имени своей допущенной организации
    Person:
      type: object
      required:
        - id
        - name
        - level
      properties:
        id:
          type: string
        name:
          type: string
          example: Анна Петрова
        level:
          type: string
          description: beginner, amateur, pro или пусто
    Participant:
      type: object
      required:
        - id
        - user
        - status
        - message
        - decision_reason
        - created_at
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/Person'
        status:
          type: string
          enum:
            - confirmed
            - pending
            - rejected
            - cancelled
            - waitlist
        message:
          type: string
          description: Сообщение к заявке (видит только организатор)
        decision_reason:
          type: string
        created_at:
          type: string
          format: date-time
    MyEntry:
      allOf:
        - $ref: '#/components/schemas/MyParticipation'
        - type: object
          required:
            - event
          properties:
            event:
              type: object
              required:
                - id
                - title
                - sport
                - starts_at
                - location
                - join_mode
                - status
                - moderation_reason
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                sport:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                location:
                  type: string
                join_mode:
                  type: string
                  enum:
                    - open
                    - request
                status:
                  type: string
                  enum:
                    - published
                    - unpublished
                    - deleted
                    - cancelled
                moderation_reason:
                  type: string
    Comment:
      type: object
      required:
        - id
        - event_id
        - author
        - is_organizer
        - organization_name
        - body
        - status
        - hidden_reason
        - created_at
