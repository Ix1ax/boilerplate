        - id
        - name
        - description
        - city
        - contacts
        - sports
        - status
        - review_reason
        - events_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Шахматный клуб «Ладья»
        description:
          type: string
        city:
          type: string
        contacts:
          type: string
        sports:
          type: array
          items:
            $ref: '#/components/schemas/Sport'
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
          description: pending — на рассмотрении; approved — допущена; rejected — отклонена
        review_reason:
          type: string
          description: Причина отказа (видят представитель и админ)
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        owner:
          $ref: '#/components/schemas/Person'
        events_count:
          type: integer
          description: Ближайших опубликованных мероприятий
        created_at:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    OrganizationInput:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          minLength: 10
          maxLength: 3000
        city:
          type: string
          maxLength: 100
        contacts:
          type: string
          maxLength: 500
        sport_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    Profile:
      type: object
      required:
        - id
        - name
        - about
        - city
        - level
        - events
      properties:
        id:
          type: string
        name:
          type: string
        about:
          type: string
        city:
          type: string
        level:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    Reason:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Причина решения — её увидит другая сторона
    File:
      type: object
      description: Метаданные файла
      required:
        - id
        - name
        - size
        - content_type
        - created_at
        - entity
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
          description: Исходное имя файла
        size:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Размер в байтах
        content_type:
          type: string
          description: Тип, определённый по содержимому
          example: application/pdf
        created_at:
          type: string
          format: date-time
        entity:
          nullable: true
          description: Запись, к которой приложен файл; null — без привязки
          type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              example: application
            id:
              type: string
    FilePage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/File'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    LlmPrompt:
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 8000
          description: Запрос пользователя
        system:
          type: string
          maxLength: 2000
          description: Системная инструкция (роль, формат ответа)
        json:
          type: boolean
          description: Попросить модель вернуть строго JSON
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: 'Творчество: 0 — предсказуемо, 1+ — разнообразнее'
    Notification:
      type: object
      required:
        - id
        - title
        - body
        - link
        - created_at
        - read_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 1000
        link:
          type: string
          description: Внутренний путь приложения или пустая строка
          example: /dashboard/tasks
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
          description: null — не прочитано
    NotificationPage:
      type: object
      required:
        - items
        - total
        - unread
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
        unread:
          type: integer
          description: Сколько непрочитанных всего
        limit:
          type: integer
        offset:
          type: integer
    MaxStatus:
      type: object
      required:
        - enabled
        - linked
      properties:
        enabled:
          type: boolean
          description: Бот настроен на сервере
        linked:
          type: boolean
          description: Пользователь подключил MAX
    TaskStatus:
      type: string
      description: Статус задачи (переходы — в описании сервиса)
      enum:
        - draft
        - todo
        - in_progress
        - done
        - archived
      example: in_progress
    Task:
      type: object
      description: Задача пользователя
      required:
        - id
        - title
        - status
        - created_at
        - moderation
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Подготовить демо для жюри
        status:
          type: string
          enum:
            - draft
            - todo
            - in_progress
            - done
            - archived
          description: Текущий статус
        created_at:
          type: string
          format: date-time
        moderation:
          nullable: true
          description: Итог ИИ-проверки; null, пока проверка ещё не выполнена (обычно несколько секунд)
          type: object
          required:
            - verdict
            - source
            - checked_at
          properties:
            verdict:
              type: string
              enum:
                - ok
                - needs_review
              description: '`needs_review` — правила или модель нашли проблему'
            source:
              type: string
              enum:
                - rules
                - rules+llm
              description: '`rules` — модель была недоступна, решали только правила'
            checked_at:
              type: string
              format: date-time
    TaskPage:
      type: object
      description: Страница задач
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
          description: Всего задач под фильтром
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 100000
    CreateTask:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям обрезаются перед сохранением
    UpdateTask:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - todo
            - in_progress
            - done
            - archived
          description: Новый статус
        comment:
          type: string
          maxLength: 2000
          description: Причина смены статуса; обязательна для перехода в archived
    TaskTransition:
      type: object
      description: Один переход статуса
      required:
        - from
        - to
        - actor
        - comment
        - created_at
      properties:
        from:
          type: string
          description: Статус до перехода
        to:
          type: string
          description: Статус после перехода
        actor:
          type: string
          description: Кто сменил статус
        comment:
          type: string
          description: Комментарий (пустой, если не нужен)
        created_at:
          type: string
          format: date-time
    TaskHistoryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskTransition'
    TaskAnalysis:
      type: object
      description: Рекомендация ИИ-проверки. Флаги и вердикт задают правила; модель только добавляет совет.
      required:
        - task_id
        - verdict
        - flags
        - advice
        - source
        - decision_required
      properties:
        task_id:
          type: string
          format: uuid
        verdict:
          type: string
          enum:
            - ok
            - needs_review
        flags:
          type: array
          description: Что нашли правила
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum:
                  - money
                  - link
                  - contact
                  - shouting
                  - too_short
              message:
                type: string
        advice:
          nullable: true
          description: Совет модели; null — модель недоступна или ответила некорректно
          type: object
          required:
            - summary
            - risk
            - suggestion
          properties:
            summary:
              type: string
              description: Вывод одним предложением
            risk:
              type: string
              enum:
                - low
                - medium
                - high
            suggestion:
              type: string
              description: Что улучшить или проверить
        source:
          type: string
          enum:
            - rules
            - rules+llm
        decision_required:
          type: boolean
          description: Всегда true — система советует, решает человек
    TaskStats:
      type: object
      description: Сводка для админского дашборда
      required:
        - total
        - completed
        - owners
        - moderation
        - by_day
      properties:
        total:
          type: integer
          description: Всего задач
        completed:
          type: integer
          description: В статусе done
        owners:
          type: integer
          description: Сколько пользователей создавали задачи
        moderation:
          type: object
          required:
            - ok
            - needs_review
            - unchecked
          properties:
            ok:
              type: integer
            needs_review:
              type: integer
            unchecked:
              type: integer
              description: Ещё не проверены
        by_day:
          type: array
          description: Создано задач по дням, последние 14 дней
          items:
            type: object
            required:
              - date
              - count
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
  responses:
    BadRequest:
      description: Некорректные входные данные (код ошибки и понятное сообщение в теле)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_body
              message: Ожидается JSON с полем title
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unauthorized:
      description: Пользователь не вошёл или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Войдите, чтобы продолжить
    Forbidden:
      description: Нет прав (нужна другая роль) или запрос пришёл с чужого адреса (Origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия
    NotFound:
      description: Запись не найдена или принадлежит другому пользователю (не различаются намеренно)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Задача не найдена
    TooManyRequests:
      description:
        'Превышен лимит: 60 изменяющих запросов в минуту на пользователя (для ИИ — 10 в минуту).
        Заголовок `Retry-After` подсказывает, через сколько секунд повторить.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд можно повторить
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit
              message: Слишком много запросов. Подождите минуту
    InternalError:
      description: Внутренняя ошибка; подробности — в логах по request_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Не удалось выполнить операцию
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unavailable:
      description: Зависимость временно недоступна (база, хранилище, Redis, модель) — повторите позже
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: cache_unavailable
              message: Попробуйте ещё раз позже
    Conflict:
      description:
        Действие сейчас невозможно (снятое или прошедшее событие, нет мест, заявка уже рассмотрена,
        заявка организации уже подана) — сообщение объясняет причину
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: 'Мероприятие недоступно для записи: оно снято с публикации или отменено'
    ValidationError:
      description: Поле формы заполнено неверно; `field` — какое поле подсветить. `reason_required` — нужна причина
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите дату и время в будущем
              field: starts_at
