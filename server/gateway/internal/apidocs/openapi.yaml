      responses:
        '201':
          description: Жалоба принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
