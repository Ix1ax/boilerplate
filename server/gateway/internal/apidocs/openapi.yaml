# СГЕНЕРИРОВАНО scripts/openapi.mjs из server/*/api/openapi.yaml — не редактируйте вручную.
# Правьте спецификацию нужного сервиса и запускайте make openapi.
openapi: 3.0.3
info:
  title: API проекта — все сервисы
  version: 0.1.0
  description: >
    Gateway — единственная публичная точка входа. Он проверяет пользователя и проксирует

    `/api/v1/...` во внутренние сервисы (у каждого своя спецификация — выберите её в списке сверху).


    **Как войти в Swagger.** Нажмите **Authorize** → в блоке `keycloak` ещё раз **Authorize** и войдите

    пользователем «Столото ID» (логины и пароли печатает `make demo`). `client_id` уже заполнен,
    `client_secret`

    оставьте пустым. После входа «Try it out» отправляет запросы с вашим токеном. Если вы уже вошли в

    приложении (http://localhost:3000), запросы работают и без Authorize — по cookie сессии.

    Для внешних клиентов и скриптов — Bearer-токен (как получить — в описании схемы bearerAuth).


    **Админка — отдельный вход.** `/api/v1/admin/*` открывается только админской сессией (`POST
    /auth/admin/login`,

    cookie `starter_admin_session`). Пользовательская сессия и Bearer-токен «Столото ID» туда не допускаются,
    даже

    с ролью admin в токене: такая роль у пользователей вырезается. Через Authorize в Swagger админские

    маршруты не вызвать — войдите в админку в этом же браузере, и Swagger отправит её cookie.


    **Общие правила для всех сервисов:**

    - Ошибки приходят в едином формате `{"error": {"code", "message", "request_id"}}`.

    - Заголовок ответа `X-Request-ID` — идентификатор запроса для поиска в логах.

    - Изменяющие запросы: не больше 60 в минуту на пользователя (запросы к ИИ — 10), иначе 429.

    - Повтор изменяющего запроса с тем же `Idempotency-Key` вернёт сохранённый ответ.

    - Списки: `limit` (1–100, по умолчанию 20) и `offset`; в ответе `total`.


    **Сервисы** (отдельные спецификации — в списке сверху):


    - `gateway` — server/gateway/api/openapi.yaml

    - `audit` — server/audit/api/openapi.yaml

    - `events` — server/events/api/openapi.yaml

    - `files` — server/files/api/openapi.yaml

    - `identity` — server/identity/api/openapi.yaml

    - `llm` — server/llm/api/openapi.yaml

    - `moderation` — server/moderation/api/openapi.yaml

    - `notifications` — server/notifications/api/openapi.yaml

    - `realtime` — server/realtime/api/openapi.yaml

    - `tasks` — server/tasks/api/openapi.yaml
servers:
  - url: /
    description: Через gateway на том же origin (в Docker — Nginx на :3000)
security:
  - keycloak:
      - openid
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Вход
    description:
      Два способа входа — «Столото ID» (единый вход через Keycloak, Authorization Code + PKCE) и
      регистрация по почте и паролю (сервис identity). В обоих случаях браузер получает только
      HttpOnly-cookie, токены и пароли остаются на сервере. (сервис gateway)
  - name: Пользователь
    description: Текущий пользователь и проверка ролей. (сервис gateway)
  - name: Вход в админку
    description:
      Отдельный вход администраторов по почте и паролю. Учётные записи хранит identity (таблица
      admins), первого суперадминистратора создаёт сервис при старте из SUPERADMIN_EMAIL и
      SUPERADMIN_PASSWORD. (сервис gateway)
  - name: Служебное
    description: Проверки работоспособности для мониторинга и оркестратора. (сервис gateway)
  - name: Журнал (админ)
    description: Просмотр журнала действий. (сервис audit)
  - name: Мероприятия
    description: Выдача, карточка и создание мероприятий; отмена организатором. (сервис events)
  - name: Запись
    description: Запись и заявки участников; решения по заявкам принимает организатор. (сервис events)
  - name: Обсуждение
    description: Вопросы и ответы под мероприятием. Ответ организатора помечен. (сервис events)
  - name: Организации
    description: Заявка на допуск, каталог и страницы допущенных организаций. (сервис events)
  - name: Профили и справочники
    description: Направления спорта и публичные профили организаторов. (сервис events)
  - name: Ищу компанию
    description:
      Запросы людей, которым не с кем заниматься, подбор подходящих событий и обезличенный спрос для
      организаторов. (сервис events)
  - name: Модерация (админ)
    description: Допуск организаций, снятие мероприятий, скрытие сообщений. Только роль `admin`. (сервис events)
  - name: Жалобы
    description:
      Сигнал модератору о нарушении в мероприятии или сообщении. Решение принимает администратор, автор
      жалобы получает результат. (сервис events)
  - name: Файлы
    description: Загрузка, список, скачивание и удаление своих файлов. (сервис files)
  - name: Учётные записи (админ)
    description: 'Пользователи обычной регистрации: поиск, карточка, блокировка. Только для роли admin. (сервис identity)'
  - name: Администраторы (суперадмин)
    description:
      'Учётные записи админки: создание, блокировка, сброс пароля, удаление. Только суперадминистратор.
      (сервис identity)'
  - name: Модель
    description: Состояние модели и генерация ответов. (сервис llm)
  - name: Админка
    description: Аналитика, журнал и отчёты. Только роль `admin`. (сервис moderation)
  - name: Уведомления
    description: Список, живой поток и отметки прочтения. (сервис notifications)
  - name: Мессенджер MAX
    description: Подключение бота MAX. Доступно, только если на сервере задан токен бота. (сервис notifications)
  - name: Realtime
    description: Подключение WebSocket. (сервис realtime)
  - name: Задачи
    description:
      Свои задачи пользователя. Чужие задачи не видны и не изменяются — проверка владельца в SQL.
      (сервис tasks)
  - name: ИИ-проверка
    description: Рекомендация по задаче. Флаги ставят правила, модель добавляет совет; решает человек. (сервис tasks)
  - name: Отчёты (админ)
    description: Сводки и выгрузки по всем пользователям. Только для роли `admin`. (сервис tasks)
paths:
  /auth/login:
    get:
      tags:
        - Вход
      operationId: login
      summary: Начать вход
      description: Перенаправляет в Keycloak. После успешного входа пользователь вернётся на адрес из `next`.
      security: []
      parameters:
        - name: next
          in: query
          description: Внутренний путь приложения, куда вернуться после входа (внешние адреса игнорируются)
          schema:
            type: string
            default: /dashboard/tasks
          example: /dashboard/tasks
      responses:
        '302':
          description: Перенаправление на страницу входа Keycloak
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/callback:
    get:
      tags:
        - Вход
      operationId: loginCallback
      summary: Возврат из Keycloak
      description:
        Вызывается Keycloak после входа, вручную не используется. Проверяет одноразовый `state`,
        обменивает код на токены, сохраняет их в Redis и ставит cookie сессии на 8 часов.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Код авторизации от Keycloak
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Одноразовый state из /auth/login
      responses:
        '302':
          description: Вход выполнен, перенаправление на `next`
        '400':
          description: Неверный или устаревший state (например, вход начат слишком давно)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_state
                  message: Срок входа истёк или вход отменён. Начните заново
        '502':
          description: Keycloak не обменял код на токены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: login_failed
                  message: Не удалось завершить вход
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      tags:
        - Вход
      operationId: logout
      summary: Выйти
      description:
        Удаляет сессию на сервере (доступ из браузера пропадает сразу) и возвращает адрес, на который
        перейти. Для «Столото ID» это выход из Keycloak (завершает и единый вход), для обычной регистрации —
        главная страница приложения. Нужен заголовок `Origin` приложения.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Сессия удалена
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
                    description: Куда перейти после выхода
              example:
                url: http://localhost:8180/realms/hackathon/protocol/openid-connect/logout?client_id=hackathon-web&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3000%2F
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/providers:
    get:
      tags:
        - Вход
      operationId: listAuthProviders
      summary: Способы входа
      description:
        Для экрана входа. «Столото ID» — единый вход через Keycloak (в этом контуре — тестовый стенд
        SSO); `local` — регистрация и вход по почте и паролю. `local.enabled=false`, если сервис учётных
        записей не подключён.
      security: []
      responses:
        '200':
          description: Доступные способы
          content:
            application/json:
              schema:
                type: object
                required:
                  - sso
                  - local
                properties:
                  sso:
                    type: object
                    required:
                      - enabled
                      - title
                      - login_url
                    properties:
                      enabled:
                        type: boolean
                      title:
                        type: string
                      login_url:
                        type: string
                        description: Перейти по адресу, добавив ?next=/куда-вернуть
                  local:
                    type: object
                    required:
                      - enabled
                      - register_url
                      - login_url
                    properties:
                      enabled:
                        type: boolean
                      register_url:
                        type: string
                      login_url:
                        type: string
              example:
                sso:
                  enabled: true
                  title: Столото ID
                  login_url: /auth/login
                local:
                  enabled: true
                  register_url: /auth/local/register
                  login_url: /auth/local/login
  /auth/local/register:
    post:
      tags:
        - Вход
      operationId: registerLocal
      summary: Зарегистрироваться по почте и паролю
      description: |
        Создаёт учётную запись и сразу входит: ставит cookie сессии `starter_session` на 8 часов (прежняя
        сессия браузера заменяется). Подтверждение почты не требуется (постановка его не просит).
        Регистрация даёт роль `user`; модераторы входят через «Столото ID».

        Пароль: 8–128 символов, буквы и цифры, не из списка распространённых и не совпадает с почтой.
        Нужен заголовок `Origin` приложения. Не больше 120 регистраций в минуту на весь сервис.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  format: password
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Имя, которое видят другие участники
            example:
              email: anna@example.ru
              password: ЗарядкаВоДворе7
              name: Анна Смирнова
      responses:
        '201':
          description: Учётная запись создана, вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Почта уже зарегистрирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: email_taken
                  message: Эта почта уже зарегистрирована. Войдите или используйте другую
        '422':
          description: Ошибка поля формы — `field` указывает, какое (email, password, name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  field: password
                  message: Пароль должен содержать буквы и цифры
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/local/login:
    post:
      tags:
        - Вход
      operationId: loginLocal
      summary: Войти по почте и паролю
      description: >
        Проверяет пароль и ставит cookie сессии (прежняя сессия браузера заменяется — так же переключаются

        пользователи). Неизвестная почта и неверный пароль неотличимы: оба — 401.


        Защита от подбора: 10 попыток в минуту на одну почту (429), а после 10 неверных паролей подряд

        учётная запись закрыта для входа на 15 минут (429 с `Retry-After`). Нужен заголовок `Origin`
        приложения.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: anna@example.ru
              password: ЗарядкаВоДворе7
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверная почта или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: Неверная почта или пароль
        '403':
          description: Учётная запись заблокирована администратором (`reason` — причина) или чужой Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: account_blocked
                  message: 'Учётная запись заблокирована: Спам в обсуждениях'
                  reason: Спам в обсуждениях
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/local/password:
    post:
      tags:
        - Вход
      operationId: changeLocalPassword
      summary: Сменить пароль
      description:
        Только для сессии обычной регистрации (у «Столото ID» пароль меняется в SSO). Требует текущий
        пароль; после смены все остальные сессии пользователя закрываются, текущая остаётся. При ошибке
        session_revocation_unavailable пароль уже изменён, отзыв остальных сессий завершится после истечения
        кэша статуса (до 30 секунд); требуется повторный вход.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Неверный текущий пароль (`field=current_password`) или слабый новый (`field=new_password`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/me:
    get:
      tags:
        - Пользователь
      operationId: getMe
      summary: Текущий пользователь
      description: Кто вошёл и с какими ролями. Для гостя — 401 (фронтенд показывает кнопку «Войти»).
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 9b2c1f0e-1234-4abc-8def-0123456789ab
                email: demo@example.test
                name: Демо Пользователь
                roles:
                  - user
                provider: sso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/admin/login:
    post:
      tags:
        - Вход в админку
      operationId: adminLogin
      summary: Войти в админку
      description: >
        Проверяет почту и пароль администратора и ставит cookie `starter_admin_session` (HttpOnly,
        SameSite=Strict).

        Пользовательская сессия при этом не меняется: вход в админку и в приложение независимы. Неизвестная
        почта

        и неверный пароль неотличимы — оба 401.


        Защита от подбора: 10 попыток в минуту на одну почту и 300 в минуту всего (429); после 10 неверных
        паролей

        подряд учётная запись закрыта на 15 минут (429 с `Retry-After`). Нужен заголовок `Origin` приложения.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            example:
              email: admin@example.test
              password: ПарольСуперадмина2026
      responses:
        '200':
          description: Вход выполнен, cookie админки установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверная почта или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_credentials
                  message: Неверная почта или пароль
        '403':
          description: Администратор заблокирован (`reason` — причина) или чужой Origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: account_blocked
                  message: 'Учётная запись заблокирована: Ушёл из команды'
                  reason: Ушёл из команды
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/admin/logout:
    post:
      tags:
        - Вход в админку
      operationId: adminLogout
      summary: Выйти из админки
      description: Удаляет админскую сессию на сервере и cookie. Пользовательская сессия не затрагивается.
      security:
        - adminCookie: []
      responses:
        '204':
          description: Сессия закрыта
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/admin/password:
    post:
      tags:
        - Вход в админку
      operationId: adminChangePassword
      summary: Сменить свой пароль администратора
      description:
        Требует текущий пароль. Новый — от 12 символов, буквы и цифры. Все остальные сессии этого
        администратора закрываются, текущая остаётся.
      security:
        - adminCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 128
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Неверный текущий пароль (`field=current_password`) или слабый новый (`field=new_password`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/me:
    get:
      tags:
        - Вход в админку
      operationId: adminMe
      security:
        - adminCookie: []
      summary: Кто вошёл в админку
      description:
        Администратор текущей админской сессии. 401 — нужно войти через `POST /auth/admin/login`.
        `superadmin` в `roles` — может управлять администраторами (`/api/v1/admin/admins`).
      responses:
        '200':
          description: Администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/ping:
    get:
      tags:
        - Пользователь
      operationId: adminPing
      security:
        - adminCookie: []
      summary: Проверка админской сессии
      description: Отвечает 200 только по админской сессии — образец закрытого маршрута админки.
      responses:
        '200':
          description: Пользователь — администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /healthz:
    get:
      tags:
        - Служебное
      operationId: healthz
      summary: Процесс жив
      description: Не обращается к зависимостям — для проверки «жив ли процесс».
      security: []
      responses:
        '200':
          description: Работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /readyz:
    get:
      tags:
        - Служебное
      operationId: readyz
      summary: Готов принимать запросы
      description: Проверяет Redis и готовность всех подключённых сервисов. 503 — что-то из них недоступно.
      security: []
      responses:
        '200':
          description: Всё готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ready
        '503':
          description: Какая-то зависимость недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable
  /api/v1/admin/audit:
    get:
      tags:
        - Журнал (админ)
      operationId: listAudit
      security:
        - adminCookie: []
      summary: Журнал действий
      description: Фильтры точные (несколько значений — через запятую), поиск `q` — по подстроке в пути и почте.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: actor
          in: query
          description: Идентификатор пользователя (sub)
          schema:
            type: string
        - name: method
          in: query
          description: HTTP-метод
          schema:
            type: string
          example: POST
        - name: status
          in: query
          description: Код ответа
          schema:
            type: string
          example: '403'
        - name: request_id
          in: query
          description: Найти записи одного запроса
          schema:
            type: string
        - name: q
          in: query
          description: Поиск по пути и почте
          schema:
            type: string
            maxLength: 100
          example: /api/v1/tasks
        - name: sort
          in: query
          description: occurred или status; «-» — по убыванию
          schema:
            type: string
            default: -occurred
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
              example:
                items:
                  - actor: 9b2c1f0e-1234-4abc-8def-0123456789ab
                    actor_email: demo@example.test
                    method: PATCH
                    route: /api/v1/tasks/*path
                    path: /api/v1/tasks/3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                    status: 200
                    request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    ip: 172.18.0.1
                    occurred_at: 2026-10-18T09:31:00Z
                total: 1
                limit: 20
                offset: 0
        '400':
          description: Недопустимая сортировка, слишком длинный поиск или неверная пагинация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_query
                  message: Недопустимая сортировка "password"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sports:
    get:
      tags:
        - Профили и справочники
      operationId: listSports
      summary: Справочник направлений
      description:
        Базовые направления и добавленные пользователями (`is_custom`). Своё направление появляется здесь
        сразу после создания события с `sport_name` — правка кода не нужна.
      responses:
        '200':
          description: Направления, сначала базовые
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sport'
              example:
                items:
                  - id: 9b2f6a1e-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    name: Шахматы
                    is_custom: false
                  - id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
                    name: Алтимат-фрисби
                    is_custom: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/sports/demand:
    get:
      tags:
        - Ищу компанию
      operationId: getDemand
      summary: Спрос на направление
      description:
        Для формы создания события — «12 человек ищут компанию на бег, чаще утром в выходные». Только
        числа, без имён. Считаются чужие активные запросы с совместимым уровнем; человек без предпочтений по
        времени учитывается в каждой части дня и каждом дне. Направление, которого ещё нет в справочнике, —
        нулевой спрос и пустой `sport_id`.
      parameters:
        - name: sport_id
          in: query
          schema:
            type: string
            format: uuid
        - name: sport_name
          in: query
          description: Своё направление, если его выбирают не из справочника
          schema:
            type: string
            maxLength: 60
          example: Бег
        - name: level
          in: query
          schema:
            type: string
            enum:
              - any
              - beginner
              - amateur
              - pro
            default: any
      responses:
        '200':
          description: Спрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Demand'
              example:
                sport_id: 3f1c7c2e-6d5a-4c3e-9a51-0b2d9e1f4a10
                count: 4
                by_day_part:
                  morning: 3
                  day: 1
                  evening: 2
                by_weekday:
                  - 1
                  - 1
                  - 1
                  - 1
                  - 1
                  - 4
                  - 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events:
    get:
      tags:
        - Мероприятия
      operationId: listEvents
      summary: Выдача мероприятий
      description:
        Только опубликованные и ещё не закончившиеся, ближайшие первыми. Поиск `q` учитывает словоформы и
        ищет также по названию направления и организации.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Текстовый поиск (до 100 символов)
          schema:
            type: string
            maxLength: 100
          example: фрисби
        - name: sport
          in: query
          description: Направления — UUID через запятую
          schema:
            type: string
        - name: mode
          in: query
          description: Режим записи
          schema:
            type: string
            enum:
              - open
              - request
        - name: level
          in: query
          description: Уровень; `beginner` показывает и события «для всех»
          schema:
            type: string
            enum:
              - any
              - beginner
              - amateur
              - pro
        - name: from
          in: query
          description: Начало не раньше (дата `2026-10-20` или RFC 3339)
          schema:
            type: string
        - name: to
          in: query
          description: Начало раньше (дата или RFC 3339)
          schema:
            type: string
        - name: organization
          in: query
          description: Только события организации (UUID)
          schema:
            type: string
            format: uuid
        - name: near
          in: query
          description:
            Рядом с точкой «широта,долгота» — только события с координатами, ближайшие первыми, в ответе
            distance_km
          schema:
            type: string
          example: 56.0106,92.8710
        - name: radius_km
          in: query
          description: Радиус для near, км
          schema:
            type: number
            minimum: 0
            maximum: 100
            default: 10
        - name: bbox
          in: query
          description: Видимая область карты «minLng,minLat,maxLng,maxLat»; вместе с near не задаётся
          schema:
            type: string
          example: 92.70,55.95,93.10,56.10
        - name: zone
          in: query
          description: Точное название зоны
          schema:
            type: string
            maxLength: 100
        - name: step_free
          in: query
          description: Только площадки без ступеней или с пандусом
          schema:
            type: boolean
      responses:
        '200':
          description: Страница мероприятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    post:
      tags:
        - Мероприятия
      operationId: createEvent
      summary: Создать мероприятие
      description:
        Публикуется сразу. `as_organization=true` — от имени своей организации; если она ещё не допущена,
        ответ 403 (проверка на сервере). Направление — `sport_id` из справочника или `sport_name` (своё, будет
        добавлено в справочник).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
            example:
              title: Фрисби в парке
              description: Учимся бросать диск и играем 5 на 5. Новичкам всё объясним.
              sport_name: Алтимат-фрисби
              starts_at: 2026-10-25T10:00:00+07:00
              ends_at: 2026-10-25T12:00:00+07:00
              location: Красноярск, остров Татышев, у центральной поляны
              level: beginner
              requirements: Удобная обувь, вода. Диски есть у организатора.
              price_note: Бесплатно
              private_info: 'Встречаемся у синего шатра, телефон организатора: +7 900 000-00-00'
              join_mode: open
              capacity: 14
              as_organization: false
      responses:
        '201':
          description: Мероприятие опубликовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Организация ещё не допущена администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: 'Организация ещё не допущена администратором: публиковать события от её имени пока нельзя'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Мероприятия
      operationId: getEvent
      summary: Карточка мероприятия
      description:
        Опубликованное видят все. Снятое, удалённое или отменённое — организатор и записавшиеся (с
        причиной в `moderation_reason`); остальным — 404. `private_info` заполнено только для организатора и
        подтверждённых участников. Админ смотрит `GET /api/v1/admin/events/{id}`.
      responses:
        '200':
          description: Мероприятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    patch:
      tags:
        - Мероприятия
      operationId: updateEvent
      summary: Изменить мероприятие
      description:
        Только организатор, только опубликованное и ещё не начавшееся. Передаются только меняемые поля;
        режим записи, направление и «от чьего имени» не меняются. Перенос времени или места — уведомление всем
        записавшимся «было → стало», напоминания придут заново от нового времени; правка условий (что взять,
        точка сбора, стоимость, уровень) — уведомление «проверьте, что изменилось». Мест не может стать
        меньше, чем уже записано (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventPatch'
            example:
              starts_at: 2026-10-25T04:00:00Z
              location: Красноярск, Центральная набережная, у Коммунального моста
      responses:
        '200':
          description: Мероприятие после изменения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Мероприятия
      operationId: cancelEvent
      summary: Отменить своё мероприятие
      description: Только организатор. Причина обязательна — её увидят записавшиеся, им уйдёт уведомление.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Площадку закрыли на ремонт, перенесём на следующую неделю
      responses:
        '200':
          description: Мероприятие отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/join:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Запись
      operationId: joinEvent
      summary: Записаться или подать заявку
      description:
        '`open` — сразу `confirmed` (или `waitlist`, если мест нет); `request` — `pending`. Повторный
        вызов возвращает текущую запись. После отказа или отмены можно записаться снова. Неопубликованное или
        прошедшее событие и собственное событие — 409.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 500
                  description: Сообщение организатору к заявке
                first_time:
                  type: boolean
                  default: false
                  description: Иду впервые — платформа подберёт проводника, если он есть
            example:
              message: Играю два года, есть своя доска
              first_time: false
      responses:
        '200':
          description: Текущая запись пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyParticipation'
              example:
                id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                status: pending
                decision_reason: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Запись
      operationId: leaveEvent
      summary: Отменить запись или заявку
      description: Освободившееся место при свободной записи сразу получает первый из листа ожидания.
      responses:
        '204':
          description: Запись отменена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/buddy:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Запись
      operationId: becomeBuddy
      summary: Готов встретить новичка
      description:
        «Встречу новичка». Подтверждённый участник (не новичок) отмечается проводником. Платформа сразу
        назначает ему подтверждённых новичков без пары — до трёх на человека, тем, у кого меньше подопечных.
        Оба получают уведомление с именем друг друга. Новичок, неподтверждённый или снятое событие — 409.
      responses:
        '200':
          description: Моя запись; в `newcomers` — кого я встречаю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyParticipation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Запись
      operationId: stopBeingBuddy
      summary: Больше не встречаю
      description:
        Подопечные передаются другим проводникам. Кому пары не нашлось — получает уведомление, а
        организатор — просьбу встретить самому. То же происходит, если проводник отменяет запись.
      responses:
        '200':
          description: Моя запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyParticipation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/remind:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Запись
      operationId: remindParticipants
      summary: Напомнить участникам сейчас
      description:
        Только организатор, не чаще раза в час, до начала события. Каждый подтверждённый участник
        получает время, адрес, точку сбора, что взять, погоду (для уличной встречи с точкой на карте) и имя
        проводника. Такие же напоминания платформа отправляет сама — за сутки и за два часа до начала.
      responses:
        '200':
          description: Сколько участников получили напоминание
          content:
            application/json:
              schema:
                type: object
                required:
                  - sent
                properties:
                  sent:
                    type: integer
              example:
                sent: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/weather:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Мероприятия
      operationId: getEventWeather
      summary: Погода на время встречи
      description:
        Прогноз Open-Meteo на час начала уличной (`outdoor`) встречи с точкой на карте и совет, что
        надеть и взять. Если прогноза нет (встреча в помещении, нет точки, больше двух недель до начала,
        сервис недоступен), `available` — false, а `reason` объясняет почему. Ошибкой это не считается.
      responses:
        '200':
          description: Прогноз или причина его отсутствия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWeather'
              example:
                available: true
                reason: ''
                forecast:
                  time: 2026-10-24T03:00:00Z
                  temperature_c: 4.2
                  precipitation_probability: 70
                  code: 61
                  description: дождь
                  advice: возьмите дождевик и сменную обувь
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/events/{id}/alternatives:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Мероприятия
      operationId: eventAlternatives
      summary: Найти другую встречу
      description:
        Если событие отменили или сняли, места кончились или заявку отклонили, путь не обрывается. То же
        направление, опубликованные предстоящие события со свободными местами, кроме своих; сначала в пределах
        15 км (если у события есть точка), затем ближайшие по времени к исходному.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Похожие встречи
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /api/v1/events/{id}/calendar.ics:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Мероприятия
      operationId: eventCalendar
      summary: Добавить в календарь
      description:
        Файл iCalendar (RFC 5545) для телефона и почты — время, место, что взять и напоминание за 2 часа.
        Точка сбора попадает в описание только тем, кому она видна (организатор и подтверждённые участники).
      responses:
        '200':
          description: Файл .ics
          content:
            text/calendar:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}/participants:
