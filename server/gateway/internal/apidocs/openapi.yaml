      summary: Отклонить жалобы на цель
      description:
        Закрывает все открытые жалобы на ту же цель; пояснение обязательно и уходит авторам жалоб. Отказ
        попадает в журнал модерации и выгрузку жалоб (`domain.report.changed`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  maxLength: 1000
            example:
              resolution: Место проведения проверили — площадка существует
      responses:
        '200':
          description: Жалоба отклонена
          content:
            application/json:
