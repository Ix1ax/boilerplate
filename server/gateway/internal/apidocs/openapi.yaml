    post:
      tags:
        - Организации
      operationId: submitOrganization
      summary: Подать заявку организации
      description:
        Создаёт профиль со статусом `pending`. До одобрения администратором публиковать события от имени
        организации нельзя. Одна организация на представителя (повтор — 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              name: Клуб скандинавской ходьбы «Сосны»
              description: Тренировки по выходным для всех возрастов, палки выдаём.
              city: Красноярск
              contacts: '@sosny_walk, +7 900 000-00-01'
              sport_ids: []
      responses:
        '201':
          description: Заявка подана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Организации
      operationId: updateMyOrganization
      summary: Исправить профиль организации
      description:
        После отказа правка означает повторную подачу — статус снова `pending`. Допущенная организация
        остаётся допущенной.
      requestBody:
        required: true
