# СГЕНЕРИРОВАНО scripts/openapi.mjs из server/*/api/openapi.yaml — не редактируйте вручную.
# Правьте спецификацию нужного сервиса и запускайте make openapi.
openapi: 3.0.3
info:
  title: API проекта — все сервисы
  version: 0.1.0
  description: |
    Gateway — единственная публичная точка входа. Он проверяет пользователя и проксирует
    `/api/v1/...` во внутренние сервисы (у каждого своя спецификация — выберите её в списке сверху).

    **Как войти в Swagger.** Нажмите **Authorize** → в блоке `keycloak` ещё раз **Authorize** и войдите
    демо-пользователем (логины и пароли печатает `make demo`). `client_id` уже заполнен, `client_secret`
    оставьте пустым. После входа «Try it out» отправляет запросы с вашим токеном. Если вы уже вошли в
    приложении (http://localhost:3000), запросы работают и без Authorize — по cookie сессии.
    Для внешних клиентов и скриптов — Bearer-токен (как получить — в описании схемы bearerAuth).

    **Общие правила для всех сервисов:**
    - Ошибки приходят в едином формате `{"error": {"code", "message", "request_id"}}`.
    - Заголовок ответа `X-Request-ID` — идентификатор запроса для поиска в логах.
    - Изменяющие запросы: не больше 60 в минуту на пользователя (запросы к ИИ — 10), иначе 429.
    - Повтор изменяющего запроса с тем же `Idempotency-Key` вернёт сохранённый ответ.
    - Списки: `limit` (1–100, по умолчанию 20) и `offset`; в ответе `total`.

    **Сервисы** (отдельные спецификации — в списке сверху):

    - `gateway` — server/gateway/api/openapi.yaml
    - `audit` — server/audit/api/openapi.yaml
    - `events` — server/events/api/openapi.yaml
    - `files` — server/files/api/openapi.yaml
    - `llm` — server/llm/api/openapi.yaml
    - `notifications` — server/notifications/api/openapi.yaml
    - `realtime` — server/realtime/api/openapi.yaml
    - `tasks` — server/tasks/api/openapi.yaml
servers:
  - url: /
    description: Через gateway на том же origin (в Docker — Nginx на :3000)
security:
  - keycloak:
      - openid
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Вход
    description:
      Вход через Keycloak (Authorization Code + PKCE). Токены остаются на сервере, браузер получает
      HttpOnly-cookie. (сервис gateway)
  - name: Пользователь
    description: Текущий пользователь и проверка ролей. (сервис gateway)
  - name: Служебное
    description: Проверки работоспособности для мониторинга и оркестратора. (сервис gateway)
  - name: Журнал (админ)
    description: Просмотр журнала действий. (сервис audit)
  - name: Мероприятия
    description: Выдача, карточка и создание мероприятий; отмена организатором. (сервис events)
  - name: Запись
    description: Запись и заявки участников; решения по заявкам принимает организатор. (сервис events)
  - name: Обсуждение
    description: Вопросы и ответы под мероприятием. Ответ организатора помечен. (сервис events)
  - name: Организации
    description: Заявка на допуск, каталог и страницы допущенных организаций. (сервис events)
  - name: Профили и справочники
    description: Направления спорта и публичные профили организаторов. (сервис events)
  - name: Модерация (админ)
    description: Допуск организаций, снятие мероприятий, скрытие сообщений. Только роль `admin`. (сервис events)
  - name: Файлы
    description: Загрузка, список, скачивание и удаление своих файлов. (сервис files)
  - name: Модель
    description: Состояние модели и генерация ответов. (сервис llm)
  - name: Уведомления
    description: Список, живой поток и отметки прочтения. (сервис notifications)
  - name: Мессенджер MAX
    description: Подключение бота MAX. Доступно, только если на сервере задан токен бота. (сервис notifications)
  - name: Realtime
    description: Подключение WebSocket. (сервис realtime)
  - name: Задачи
    description:
      Свои задачи пользователя. Чужие задачи не видны и не изменяются — проверка владельца в SQL.
      (сервис tasks)
  - name: ИИ-проверка
    description: Рекомендация по задаче. Флаги ставят правила, модель добавляет совет; решает человек. (сервис tasks)
  - name: Отчёты (админ)
    description: Сводки и выгрузки по всем пользователям. Только для роли `admin`. (сервис tasks)
paths:
  /auth/login:
    get:
      tags:
        - Вход
      operationId: login
      summary: Начать вход
      description: Перенаправляет в Keycloak. После успешного входа пользователь вернётся на адрес из `next`.
      security: []
      parameters:
        - name: next
          in: query
          description: Внутренний путь приложения, куда вернуться после входа (внешние адреса игнорируются)
          schema:
            type: string
            default: /dashboard/tasks
          example: /dashboard/tasks
      responses:
        '302':
          description: Перенаправление на страницу входа Keycloak
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/callback:
    get:
      tags:
        - Вход
      operationId: loginCallback
      summary: Возврат из Keycloak
      description:
        Вызывается Keycloak после входа, вручную не используется. Проверяет одноразовый `state`,
        обменивает код на токены, сохраняет их в Redis и ставит cookie сессии на 8 часов.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Код авторизации от Keycloak
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: Одноразовый state из /auth/login
      responses:
        '302':
          description: Вход выполнен, перенаправление на `next`
        '400':
          description: Неверный или устаревший state (например, вход начат слишком давно)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_state
                  message: Срок входа истёк или вход отменён. Начните заново
        '502':
          description: Keycloak не обменял код на токены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: login_failed
                  message: Не удалось завершить вход
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      tags:
        - Вход
      operationId: logout
      summary: Выйти
      description:
        Удаляет сессию на сервере (доступ из браузера пропадает сразу) и возвращает адрес выхода из
        Keycloak — фронтенд открывает его, чтобы завершить и единый вход. Нужен заголовок `Origin` приложения.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Сессия удалена
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
                    description: Адрес выхода из Keycloak
              example:
                url: http://localhost:8180/realms/hackathon/protocol/openid-connect/logout?client_id=hackathon-web&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3000%2F
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/demo:
    get:
      tags:
        - Вход
      operationId: listDemoAccounts
      summary: Демо-аккаунты для быстрого входа
      description:
        Карточки «Войти как…» на экране входа. Маршрут есть, только если включён `DEMO_LOGIN=true`; иначе
        404 и фронтенд показывает обычную форму. Почты и пароли не возвращаются.
      security: []
      responses:
        '200':
          description: Аккаунты в порядке показа
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - key
                        - name
                        - role
                        - hint
                      properties:
                        key:
                          type: string
                          description: Идентификатор для `POST /auth/demo/{key}`
                        name:
                          type: string
                        role:
                          type: string
                          description: Роль простыми словами
                        hint:
                          type: string
                          description: Что проверить под этим аккаунтом
              example:
                items:
                  - key: anna
                    name: Анна Смирнова
                    role: Пользователь
                    hint: Найти событие, записаться, создать своё, задать вопрос
                  - key: admin
                    name: Модератор Платформы
                    role: Администратор
                    hint: Допуск организаций, снятие событий, скрытие сообщений
  /auth/demo/{key}:
    post:
      tags:
        - Вход
      operationId: demoLogin
      summary: Войти как демо-аккаунт
      description:
        Gateway входит в Keycloak по паролю аккаунта из окружения и ставит обычную cookie сессии — дальше
        всё работает как после входа через форму (роли, обновление токена, выход). Прежняя сессия заменяется,
        поэтому так же переключаются роли. Нужен заголовок `Origin` приложения.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: anna
      responses:
        '200':
          description: Сессия создана, cookie `starter_session` установлена
          content:
            application/json:
              schema:
                type: object
                required:
                  - key
                  - name
                properties:
                  key:
                    type: string
                  name:
                    type: string
              example:
                key: anna
                name: Анна Смирнова
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Keycloak отклонил вход демо-аккаунтом — realm не обновлён после `make setup`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Keycloak недоступен или ответил ошибкой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/me:
    get:
      tags:
        - Пользователь
      operationId: getMe
      summary: Текущий пользователь
      description: Кто вошёл и с какими ролями. Для гостя — 401 (фронтенд показывает кнопку «Войти»).
      responses:
        '200':
          description: Пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 9b2c1f0e-1234-4abc-8def-0123456789ab
                email: demo@example.test
                name: Демо Пользователь
                roles:
                  - user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/ping:
    get:
      tags:
        - Пользователь
      operationId: adminPing
      summary: Проверка роли admin
      description: Отвечает 200 только администратору — образец закрытого по роли маршрута.
      responses:
        '200':
          description: Пользователь — администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /healthz:
    get:
      tags:
        - Служебное
      operationId: healthz
      summary: Процесс жив
      description: Не обращается к зависимостям — для проверки «жив ли процесс».
      security: []
      responses:
        '200':
          description: Работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
  /readyz:
    get:
      tags:
        - Служебное
      operationId: readyz
      summary: Готов принимать запросы
      description: Проверяет Redis и готовность всех подключённых сервисов. 503 — что-то из них недоступно.
      security: []
      responses:
        '200':
          description: Всё готово
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ready
        '503':
          description: Какая-то зависимость недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable
  /api/v1/admin/audit:
    get:
      tags:
        - Журнал (админ)
      operationId: listAudit
      summary: Журнал действий
      description: Фильтры точные (несколько значений — через запятую), поиск `q` — по подстроке в пути и почте.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: actor
          in: query
          description: Идентификатор пользователя (sub)
          schema:
            type: string
        - name: method
          in: query
          description: HTTP-метод
          schema:
            type: string
          example: POST
        - name: status
          in: query
          description: Код ответа
          schema:
            type: string
          example: '403'
        - name: request_id
          in: query
          description: Найти записи одного запроса
          schema:
            type: string
        - name: q
          in: query
          description: Поиск по пути и почте
          schema:
            type: string
            maxLength: 100
          example: /api/v1/tasks
        - name: sort
          in: query
          description: occurred или status; «-» — по убыванию
          schema:
            type: string
            default: -occurred
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
              example:
                items:
                  - actor: 9b2c1f0e-1234-4abc-8def-0123456789ab
                    actor_email: demo@example.test
                    method: PATCH
                    route: /api/v1/tasks/*path
                    path: /api/v1/tasks/3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                    status: 200
                    request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    ip: 172.18.0.1
                    occurred_at: 2026-10-18T09:31:00Z
                total: 1
                limit: 20
                offset: 0
        '400':
          description: Недопустимая сортировка, слишком длинный поиск или неверная пагинация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_query
                  message: Недопустимая сортировка "password"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/sports:
    get:
      tags:
        - Профили и справочники
      operationId: listSports
      summary: Справочник направлений
      description:
        Базовые направления и добавленные пользователями (`is_custom`). Своё направление появляется здесь
        сразу после создания события с `sport_name` — правка кода не нужна.
      responses:
        '200':
          description: Направления, сначала базовые
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sport'
              example:
                items:
                  - id: 9b2f6a1e-1c2d-4e5f-8a9b-0c1d2e3f4a5b
                    name: Шахматы
                    is_custom: false
                  - id: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
                    name: Алтимат-фрисби
                    is_custom: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events:
    get:
      tags:
        - Мероприятия
      operationId: listEvents
      summary: Выдача мероприятий
      description:
        Только опубликованные и ещё не закончившиеся, ближайшие первыми. Поиск `q` учитывает словоформы и
        ищет также по названию направления и организации.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Текстовый поиск (до 100 символов)
          schema:
            type: string
            maxLength: 100
          example: фрисби
        - name: sport
          in: query
          description: Направления — UUID через запятую
          schema:
            type: string
        - name: mode
          in: query
          description: Режим записи
          schema:
            type: string
            enum:
              - open
              - request
        - name: level
          in: query
          description: Уровень; `beginner` показывает и события «для всех»
          schema:
            type: string
            enum:
              - any
              - beginner
              - amateur
              - pro
        - name: from
          in: query
          description: Начало не раньше (дата `2026-10-20` или RFC 3339)
          schema:
            type: string
        - name: to
          in: query
          description: Начало раньше (дата или RFC 3339)
          schema:
            type: string
        - name: organization
          in: query
          description: Только события организации (UUID)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Страница мероприятий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Мероприятия
      operationId: createEvent
      summary: Создать мероприятие
      description:
        Публикуется сразу. `as_organization=true` — от имени своей организации; если она ещё не допущена,
        ответ 403 (проверка на сервере). Направление — `sport_id` из справочника или `sport_name` (своё, будет
        добавлено в справочник).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
            example:
              title: Фрисби в парке
              description: Учимся бросать диск и играем 5 на 5. Новичкам всё объясним.
              sport_name: Алтимат-фрисби
              starts_at: 2026-10-25T10:00:00+07:00
              ends_at: 2026-10-25T12:00:00+07:00
              location: Красноярск, остров Татышев, у центральной поляны
              level: beginner
              requirements: Удобная обувь, вода. Диски есть у организатора.
              price_note: Бесплатно
              private_info: 'Встречаемся у синего шатра, телефон организатора: +7 900 000-00-00'
              join_mode: open
              capacity: 14
              as_organization: false
      responses:
        '201':
          description: Мероприятие опубликовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Организация ещё не допущена администратором
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: forbidden
                  message: 'Организация ещё не допущена администратором: публиковать события от её имени пока нельзя'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/events/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Мероприятия
      operationId: getEvent
      summary: Карточка мероприятия
      description:
        Опубликованное видят все. Снятое, удалённое или отменённое — организатор, записавшиеся (с
        причиной в `moderation_reason`) и админ; остальным — 404. `private_info` заполнено только для
        организатора, подтверждённых участников и админа.
      responses:
        '200':
          description: Мероприятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
