          description: Доступна ли Ollama и скачана ли модель
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - model
                  - model_installed
                properties:
                  available:
                    type: boolean
                    description: Ollama отвечает
                  model:
                    type: string
                  model_installed:
                    type: boolean
                    description: Нужная модель скачана
              example:
                available: true
                model: qwen2.5:1.5b
                model_installed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/llm/generate:
    post:
      tags:
        - Модель
      operationId: generate
      summary: Ответ модели целиком
      description: Ждёт полный ответ (до нескольких десятков секунд на CPU). Для чата удобнее поток — /llm/stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmPrompt'
            examples:
              text:
                summary: Обычный ответ
                value:
                  prompt: Придумай название для волонтёрского проекта
              json:
                summary: Структурированный ответ
                value:
                  system: 'Ответь JSON: {"title": string}'
                  prompt: Придумай название
                  json: true
                  temperature: 0.2
      responses:
        '200':
          description: Ответ модели
          content:
            application/json:
              schema:
                type: object
                required:
                  - text
                  - model
                properties:
                  text:
                    type: string
                  model:
                    type: string
              example:
                text: «Доброе дело рядом»
                model: qwen2.5:1.5b
        '400':
          description: Пустой запрос, слишком длинный или неверная temperature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Запрос должен содержать от 1 до заданного предела символов
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Лимит запросов (`rate_limit`) или модель занята (`model_busy`, повторите через несколько секунд)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: model_busy
                  message: Модель занята, повторите через несколько секунд
        '503':
          description: Модель не запущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: model_unavailable
                  message: Модель недоступна. Запустите её командой make llm
  /api/v1/llm/stream:
    post:
      tags:
        - Модель
      operationId: generateStream
      summary: Ответ модели потоком (SSE)
      description: |
        Текст приходит по частям, пока модель генерирует: события `data: {"t": "фрагмент"}`,
        в конце `event: done`, при сбое посреди ответа — `event: error`. Ошибки до начала потока
        (400, 429, 503) приходят обычным JSON, как у /llm/generate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmPrompt'
            example:
              prompt: Объясни в двух предложениях, что такое волонтёрство
      responses:
        '200':
          description: Поток фрагментов
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                data: {"t":"Волонтёрство — "}

                data: {"t":"это добровольная помощь…"}

                event: done
                data: {}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/moderation/dashboard:
    get:
      tags:
        - Админка
      operationId: moderationDashboard
      security:
        - adminCookie: []
      summary: Дашборд администратора
      description:
        Что требует решения (заявки организаций, самые давние — первыми) и как живёт платформа — события,
        записи, новички, сообщения, «Ищу компанию», сбор состава, жалобы и пользовательские направления, ряд
        за 14 дней по Красноярску и популярные направления.
      responses:
        '200':
          description: Дашборд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/moderation/log:
    get:
      tags:
        - Админка
      operationId: moderationLog
      security:
        - adminCookie: []
      summary: Журнал модерации
      description:
        Решения по организациям, смена статуса мероприятий (снятие, удаление, возврат, отмена — в том
        числе автоматическая, когда не собран состав), скрытие сообщений, отказ по жалобе (принятая жалоба уже
        видна как скрытие или удаление цели) и скрытие или возврат пользовательского направления. Кто, когда и
        с какой причиной.
      parameters:
        - name: entity
          in: query
          description: organization, event, comment, report или sport; несколько — через запятую
          schema:
            type: string
        - name: to
          in: query
          description: Новый статус, например rejected или unpublished
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Поиск по названию, автору решения и причине
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - at
              - -at
            default: -at
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/moderation/comments:
    get:
      tags:
        - Админка
      operationId: moderationComments
      security:
        - adminCookie: []
      summary: Лента сообщений
      description:
        Последние сообщения всех обсуждений в одном месте. Скрыть сообщение — `POST
        /api/v1/admin/comments/{id}/hide` сервиса events.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - visible
              - hidden
        - name: event_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Поиск по тексту, автору и названию мероприятия
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created
              - -created
            default: -created
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница сообщений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/moderation/reports/events.csv:
    get:
      tags:
        - Админка
      operationId: moderationReportEvents
      security:
        - adminCookie: []
      summary: Выгрузка мероприятий
      description:
        'Все мероприятия во всех статусах: организатор, время по Красноярску, режим, статус и причина,
        участники, заявки, новички, состав. CSV для Excel — UTF-8 с BOM, разделитель «;», статусы по-русски.'
      responses:
        '200':
