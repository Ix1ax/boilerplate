        - Модерация (админ)
      operationId: adminHideSport
      security:
        - adminCookie: []
      summary: Скрыть пользовательское направление
      description:
        Спам, оскорбление или дубль. Направление пропадает из справочника, новые события и запросы с ним
        создать нельзя; уже созданные события остаются (их снимают отдельно). Базовые направления не
