        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Обсуждение
      operationId: addComment
      summary: Задать вопрос или ответить
      description:
        Писать может любой вошедший пользователь, пока событие опубликовано. `parent_id` — ответ на
        сообщение верхнего уровня. Организатор получает уведомление о вопросе, автор вопроса — об ответе;
        открытые страницы обновляются через WebSocket-канал `room:event:{id}`.
