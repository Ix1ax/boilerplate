    post:
      tags:
        - Модерация (админ)
      operationId: adminRepublishDomain
      security:
        - adminCookie: []
      summary: Переотправить снимки в moderation
      description:
        Ставит в outbox снимки всех организаций, событий, записей, сообщений, запросов «Ищу компанию»,
        жалоб и направлений (`domain.*.changed`). Нужно, когда сервис moderation подключён позже или его база
        очищена. Повтор безопасен.
      responses:
        '202':
          description: Сколько снимков поставлено в очередь
          content:
            application/json:
              schema:
                type: object
                required:
                  - queued
                properties:
                  queued:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
