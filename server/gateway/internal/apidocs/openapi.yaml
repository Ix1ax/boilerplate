              $ref: '#/components/schemas/Counter'
        quorum:
          type: object
          required:
            - gathering
            - reached
            - failed
          properties:
            gathering:
              $ref: '#/components/schemas/Counter'
            reached:
              $ref: '#/components/schemas/Counter'
            failed:
              $ref: '#/components/schemas/Counter'
        reports:
          type: object
          description: Жалобы пользователей на мероприятия, сообщения, отзывы, истории и личные сообщения
          required:
            - open
            - resolved_week
            - dismissed_week
            - top_reason
          properties:
            open:
              $ref: '#/components/schemas/Counter'
            resolved_week:
              $ref: '#/components/schemas/Counter'
            dismissed_week:
              $ref: '#/components/schemas/Counter'
            top_reason:
              type: string
              nullable: true
              enum:
                - spam
                - offensive
                - fraud
                - wrong_info
                - dangerous
                - other
                - null
              description: Самая частая причина среди открытых жалоб; null, если открытых нет
          example:
            open: 4
            resolved_week: 7
            dismissed_week: 2
            top_reason: spam
        sports:
          type: object
          description: Пользовательские направления («своё направление» при создании события)
          required:
            - custom
            - hidden
          properties:
            custom:
              $ref: '#/components/schemas/Counter'
            hidden:
              $ref: '#/components/schemas/Counter'
          example:
            custom: 3
            hidden: 1
        series:
          type: array
          description: 14 последних дней по Красноярску
          items:
            type: object
            required:
              - date
              - events
              - participations
            properties:
              date:
                type: string
                format: date
              events:
                $ref: '#/components/schemas/Counter'
              participations:
                $ref: '#/components/schemas/Counter'
        top_sports:
          type: array
          items:
            type: object
            required:
              - sport
              - events
            properties:
              sport:
                type: string
              events:
                $ref: '#/components/schemas/Counter'
        pending_organizations:
          type: array
          description: Самые давние заявки на допуск
          items:
            type: object
            required:
              - id
              - name
              - owner_name
              - created_at
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              owner_name:
                type: string
              created_at:
                type: string
                format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Время последнего полученного изменения
    LogEntry:
      type: object
      required:
        - entity
        - entity_id
        - title
        - from
        - to
        - actor
        - comment
        - at
      properties:
        entity:
          type: string
          enum:
            - organization
            - event
            - comment
            - report
            - sport
        entity_id:
          type: string
          format: uuid
        title:
          type: string
        from:
          type: string
        to:
          type: string
        actor:
          type: string
          description: 'Кто решил: имя администратора, организатор или «Платформа»'
        comment:
          type: string
          description: Причина
        at:
          type: string
          format: date-time
    LogPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ModerationComment:
      type: object
      required:
        - id
        - event_id
        - event_title
        - author_name
        - body
        - status
        - hidden_reason
        - created_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
        author_name:
          type: string
        body:
          type: string
        status:
          type: string
          enum:
            - visible
            - hidden
        hidden_reason:
          type: string
        created_at:
          type: string
          format: date-time
    CommentPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationComment'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Notification:
      type: object
      required:
        - id
        - title
        - body
        - link
        - created_at
        - read_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 1000
        link:
          type: string
          description: Внутренний путь приложения или пустая строка
          example: /dashboard/tasks
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true
          description: null — не прочитано
    NotificationPage:
      type: object
      required:
        - items
        - total
        - unread
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        total:
          type: integer
        unread:
          type: integer
          description: Сколько непрочитанных всего
        limit:
          type: integer
        offset:
          type: integer
    MaxStatus:
      type: object
      required:
        - enabled
        - linked
      properties:
        enabled:
          type: boolean
          description: Бот настроен на сервере
        linked:
          type: boolean
          description: Пользователь подключил MAX
    TaskStatus:
      type: string
      description: Статус задачи (переходы — в описании сервиса)
      enum:
        - draft
        - todo
        - in_progress
        - done
        - archived
      example: in_progress
    Task:
      type: object
      description: Задача пользователя
      required:
        - id
        - title
        - status
        - created_at
        - moderation
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Подготовить демо для жюри
        status:
          type: string
          enum:
            - draft
            - todo
            - in_progress
            - done
            - archived
          description: Текущий статус
        created_at:
          type: string
          format: date-time
        moderation:
          nullable: true
          description: Итог ИИ-проверки; null, пока проверка ещё не выполнена (обычно несколько секунд)
          type: object
          required:
            - verdict
            - source
            - checked_at
          properties:
            verdict:
              type: string
              enum:
                - ok
                - needs_review
              description: '`needs_review` — правила или модель нашли проблему'
            source:
              type: string
              enum:
                - rules
                - rules+llm
              description: '`rules` — модель была недоступна, решали только правила'
            checked_at:
              type: string
              format: date-time
    TaskPage:
      type: object
      description: Страница задач
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
          description: Всего задач под фильтром
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 100000
    CreateTask:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям обрезаются перед сохранением
    UpdateTask:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - todo
            - in_progress
            - done
            - archived
          description: Новый статус
        comment:
          type: string
          maxLength: 2000
          description: Причина смены статуса; обязательна для перехода в archived
    TaskTransition:
      type: object
      description: Один переход статуса
      required:
        - from
        - to
        - actor
        - comment
        - created_at
      properties:
        from:
          type: string
          description: Статус до перехода
        to:
          type: string
          description: Статус после перехода
        actor:
          type: string
          description: Кто сменил статус
        comment:
          type: string
          description: Комментарий (пустой, если не нужен)
        created_at:
          type: string
          format: date-time
    TaskHistoryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskTransition'
    TaskAnalysis:
      type: object
      description: Рекомендация ИИ-проверки. Флаги и вердикт задают правила; модель только добавляет совет.
      required:
        - task_id
        - verdict
        - flags
        - advice
        - source
        - decision_required
      properties:
        task_id:
          type: string
          format: uuid
        verdict:
          type: string
          enum:
            - ok
            - needs_review
        flags:
          type: array
          description: Что нашли правила
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum:
                  - money
                  - link
                  - contact
                  - shouting
                  - too_short
              message:
                type: string
        advice:
          nullable: true
          description: Совет модели; null — модель недоступна или ответила некорректно
          type: object
          required:
            - summary
            - risk
            - suggestion
          properties:
            summary:
              type: string
              description: Вывод одним предложением
            risk:
              type: string
              enum:
                - low
                - medium
                - high
            suggestion:
              type: string
              description: Что улучшить или проверить
        source:
          type: string
          enum:
            - rules
            - rules+llm
        decision_required:
          type: boolean
          description: Всегда true — система советует, решает человек
    TaskStats:
      type: object
      description: Сводка для админского дашборда
      required:
        - total
        - completed
        - owners
        - moderation
        - by_day
      properties:
        total:
          type: integer
          description: Всего задач
        completed:
          type: integer
          description: В статусе done
        owners:
          type: integer
          description: Сколько пользователей создавали задачи
        moderation:
          type: object
          required:
            - ok
            - needs_review
            - unchecked
          properties:
            ok:
              type: integer
            needs_review:
              type: integer
            unchecked:
              type: integer
              description: Ещё не проверены
        by_day:
          type: array
          description: Создано задач по дням, последние 14 дней
          items:
            type: object
            required:
              - date
              - count
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
    CompanyWindow:
      type: object
      required:
        - starts_at
        - ends_at
      description: Конкретное будущее окно от часа до суток; не повторяется еженедельно.
      properties:
        starts_at:
          type: string
          format: date-time
          example: 2026-10-24T12:00:00+07:00
        ends_at:
          type: string
          format: date-time
          example: 2026-10-24T14:00:00+07:00
    CompanyProposal:
      type: object
      required:
        - version
        - sport_id
        - sport_name
        - zone
        - level
        - starts_at
        - ends_at
        - count
        - interested
        - response
        - event_id
        - enrolled
      properties:
        version:
          type: string
        sport_id:
          type: string
          format: uuid
        sport_name:
          type: string
        zone:
          type: string
        level:
          type: string
          enum:
            - any
            - beginner
            - amateur
            - pro
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        count:
          type: integer
          description: Число реальных активных запросов
        interested:
          type: integer
        response:
          type: boolean
          nullable: true
        event_id:
          type: string
          format: uuid
          nullable: true
        enrolled:
          type: integer
          description: Число подтверждённых записей опубликованной встречи
    CompanyProposalEnvelope:
      type: object
      required:
        - proposal
      properties:
        proposal:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CompanyProposal'
    CompanyDemandPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyProposal'
  responses:
    BadRequest:
      description: Некорректные входные данные (код ошибки и понятное сообщение в теле)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_body
              message: Ожидается JSON с полем title
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unauthorized:
      description: Пользователь не вошёл или токен недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: Войдите, чтобы продолжить
    Forbidden:
      description: Нет прав (нужна другая роль) или запрос пришёл с чужого адреса (Origin)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия
    NotFound:
      description: Запись не найдена или принадлежит другому пользователю (не различаются намеренно)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Задача не найдена
    TooManyRequests:
      description:
        'Превышен лимит: 60 изменяющих запросов в минуту на пользователя (для ИИ — 10 в минуту).
        Заголовок `Retry-After` подсказывает, через сколько секунд повторить.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд можно повторить
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: rate_limit
              message: Слишком много запросов. Подождите минуту
    InternalError:
      description: Внутренняя ошибка; подробности — в логах по request_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal_error
              message: Не удалось выполнить операцию
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unavailable:
      description: Зависимость временно недоступна (база, хранилище, Redis, модель) — повторите позже
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: cache_unavailable
              message: Попробуйте ещё раз позже
    Conflict:
      description:
        Действие сейчас невозможно (снятое или прошедшее событие, нет мест, заявка уже рассмотрена,
        заявка организации уже подана) — сообщение объясняет причину
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: conflict
              message: 'Мероприятие недоступно для записи: оно снято с публикации или отменено'
    ValidationError:
      description: Поле формы заполнено неверно; `field` — какое поле подсветить. `reason_required` — нужна причина
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: validation_error
              message: Укажите дату и время в будущем
              field: starts_at
