# Спецификация API сервиса tasks — источник правды для его маршрутов.
# После правок: make openapi (соберёт общий packages/contracts/openapi.yaml и TS-типы).
# Пути указаны так, как их видит клиент через gateway (/api/v1/...).
openapi: 3.0.3
info:
  title: Сервис задач (tasks)
  version: 0.1.0
  description: |
    Домен «задачи» — образец для новых доменов: список с фильтрами и поиском, статусы с историей
    переходов, асинхронная ИИ-проверка и админские отчёты.

    **Статусы и переходы.** Новая задача создаётся в статусе `draft`. Разрешены переходы:

    | Из | В |
    | --- | --- |
    | `draft` | `todo` |
    | `todo` | `in_progress`, `archived` |
    | `in_progress` | `done`, `todo` |
    | `done` | `archived`, `in_progress` |
    | `archived` | `todo` |

    Переход в `archived` требует комментарий — он сохраняется в истории. Недопустимый переход — 409.

    **ИИ-проверка.** После создания задачи событие `task.created` уходит в RabbitMQ, и через
    несколько секунд в поле `moderation` появляется результат (правила + совет модели). Пока
    проверки нет, `moderation` равно `null`. Решение по задаче всегда принимает человек.
servers:
  - url: /
    description: Через gateway на том же origin (в Docker — Nginx на :3000)
security:
  - keycloak:
      - openid
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Задачи
    description: Свои задачи пользователя. Чужие задачи не видны и не изменяются — проверка владельца в SQL.
  - name: ИИ-проверка
    description: Рекомендация по задаче. Флаги ставят правила, модель добавляет совет; решает человек.
  - name: Отчёты (админ)
    description: Сводки и выгрузки по всем пользователям. Только для роли `admin`.
paths:
  /api/v1/tasks:
    get:
      tags:
        - Задачи
      operationId: listTasks
      summary: Список своих задач
      description: Страница задач текущего пользователя с фильтром по статусу, поиском по названию и сортировкой.
        `total` — сколько всего задач подходит под фильтр (для пагинации).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          description: Фильтр по статусу; несколько — через запятую
          schema:
            type: string
          example: todo,in_progress
        - name: q
          in: query
          description: Поиск по подстроке в названии (без учёта регистра)
          schema:
            type: string
            maxLength: 100
          example: демо
        - name: sort
          in: query
          description: Поле сортировки — `created`, `title` или `status`; минус в начале — по убыванию
          schema:
            type: string
            default: -created
          example: title
      responses:
        "200":
          description: Страница задач
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
              example:
                items:
                  - id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                    title: Подготовить демо для жюри
                    status: in_progress
                    created_at: 2026-10-18T09:30:00Z
                    moderation:
                      verdict: ok
                      source: rules+llm
                      checked_at: 2026-10-18T09:30:04Z
                total: 1
                limit: 20
                offset: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - Задачи
      operationId: createTask
      summary: Создать задачу
      description: Создаёт задачу в статусе `draft`. В той же транзакции ставится событие `task.created` — оно
        запустит ИИ-проверку и уведомление владельцу.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
            example:
              title: Подготовить демо для жюри
      responses:
        "201":
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
              example:
                id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                title: Подготовить демо для жюри
                status: draft
                created_at: 2026-10-18T09:30:00Z
                moderation: null
        "400":
          description: "`invalid_body` — нет поля title; `validation_error` — пустое или длиннее 200 символов"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: Название должно содержать от 1 до 200 символов
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags:
        - Задачи
      operationId: updateTaskStatus
      summary: Сменить статус задачи
      description: Переводит задачу в новый статус по правилам переходов (см. описание сервиса) и записывает переход
        в историю. Проверка и запись идут одной транзакцией с блокировкой строки.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
            examples:
              start:
                summary: Взять в работу
                value:
                  status: in_progress
              archive:
                summary: Архивировать (нужен комментарий)
                value:
                  status: archived
                  comment: Больше не актуально
      responses:
        "200":
          description: Статус изменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: "`invalid_id`, `invalid_body` (нет status) или `comment_required` (архивация без комментария)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: comment_required
                  message: Укажите комментарий к смене статуса
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Переход из текущего статуса в запрошенный запрещён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_transition
                  message: "Недопустимая смена статуса: draft → done"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Задачи
      operationId: deleteTask
      summary: Удалить задачу
      responses:
        "204":
          description: Задача удалена
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tasks/{id}/history:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags:
        - Задачи
      operationId: getTaskHistory
      summary: История статусов задачи
      description: Все переходы статуса от старых к новым — с автором и комментарием. Доступна только владельцу.
      responses:
        "200":
          description: История переходов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskHistoryPage"
              example:
                items:
                  - from: draft
                    to: todo
                    actor: demo@example.test
                    comment: ""
                    created_at: 2026-10-18T09:31:00Z
                  - from: todo
                    to: archived
                    actor: demo@example.test
                    comment: Больше не актуально
                    created_at: 2026-10-18T10:05:00Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tasks/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags:
        - ИИ-проверка
      operationId: analyzeTask
      summary: Проверить задачу сейчас
      description: "Ручная проверка (автоматическая запускается после создания). Правила ищут сбор денег, ссылки,
        контакты, капслок и слишком короткий текст и задают вердикт; модель Qwen, если доступна, добавляет
        краткий совет. Если модель недоступна или занята — ответ только по правилам (`source: rules`), это не
        ошибка. Лимит — 10 проверок в минуту."
      responses:
        "200":
          description: Рекомендация (решение принимает человек)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAnalysis"
              example:
                task_id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                verdict: needs_review
                flags:
                  - code: money
                    message: Похоже на сбор или перевод денег
                advice:
                  summary: В тексте просьба перевести деньги
                  risk: high
                  suggestion: Уточните цель и уберите реквизиты
                source: rules+llm
                decision_required: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/tasks/stats:
    get:
      tags:
        - Отчёты (админ)
      operationId: getTaskStats
      summary: Сводка для дашборда
      description: Итоги по всем задачам, разбивка по ИИ-проверке и число созданных задач за последние 14 дней (для
        графика). Все цифры из одного снимка данных.
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"
              example:
                total: 42
                completed: 17
                owners: 9
                moderation:
                  ok: 30
                  needs_review: 4
                  unchecked: 8
                by_day:
                  - date: 2026-10-17
                    count: 5
                  - date: 2026-10-18
                    count: 7
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/tasks/export.csv:
    get:
      tags:
        - Отчёты (админ)
      operationId: exportTasksCsv
      summary: Выгрузка всех задач в CSV
      description: "Файл для Excel: UTF-8 с BOM, разделитель «;», ячейки, похожие на формулы, экранируются. Колонки:
        ID, Владелец, Название, Статус, Создана, Проверка ИИ, Источник проверки."
      responses:
        "200":
          description: CSV-файл (скачивается как tasks-ГГГГ-ММ-ДД.csv)
          content:
            text/csv:
              schema:
                type: string
              example: |
                ID;Владелец;Название;Статус;Создана;Проверка ИИ;Источник проверки
                3f6c…;a1b2…;Подготовить демо;done;2026-10-18T09:30:00Z;замечаний нет;rules+llm
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: starter_session
      description: Сессия браузера. Ставится после входа через `/auth/login`, хранит только случайный идентификатор
        (токены Keycloak лежат на сервере). Изменяющие запросы с cookie дополнительно требуют заголовок
        `Origin`, равный адресу приложения (защита от CSRF).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token Keycloak для внешних клиентов и тестов. Получить локально: `POST
        http://localhost:8180/realms/hackathon/protocol/openid-connect/token` с `grant_type=password`,
        `client_id=hackathon-cli`, логином и паролем демо-пользователя."
    keycloak:
      type: oauth2
      description: "Вход через Keycloak прямо из Swagger: нажмите Authorize → keycloak → Authorize и войдите
        демо-пользователем (логины и пароли печатает make demo). Отдельный клиент hackathon-swagger с PKCE —
        на вход в приложение не влияет. Адрес Keycloak gateway подставляет из OIDC_ISSUER."
      flows:
        authorizationCode:
          authorizationUrl: "{{OIDC_ISSUER}}/protocol/openid-connect/auth"
          tokenUrl: "{{OIDC_ISSUER}}/protocol/openid-connect/token"
          refreshUrl: "{{OIDC_ISSUER}}/protocol/openid-connect/token"
          scopes:
            openid: Вход (OpenID Connect)
            profile: Имя пользователя
            email: Почта
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Идентификатор записи (UUID)
      schema:
        type: string
        format: uuid
      example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
    Limit:
      name: limit
      in: query
      description: Сколько записей вернуть (страница)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      description: Сколько записей пропустить от начала
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Необязательный ключ защиты от двойной отправки (двойной клик, повтор после обрыва сети). Повтор
        с тем же ключом в течение 24 часов вернёт сохранённый ответ с заголовком `Idempotent-Replayed: true`,
        а не выполнит действие ещё раз."
      schema:
        type: string
        maxLength: 100
      example: 6f1e2d3c-create-task-1
  schemas:
    Error:
      type: object
      description: Единый формат ошибки всех сервисов.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Машинный код ошибки — по нему фронтенд выбирает реакцию
              example: validation_error
            message:
              type: string
              description: Сообщение для человека, на русском
              example: Название должно содержать от 1 до 200 символов
            request_id:
              type: string
              description: Идентификатор запроса — по нему ошибку находят в логах всех сервисов
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    TaskStatus:
      type: string
      description: Статус задачи (переходы — в описании сервиса)
      enum:
        - draft
        - todo
        - in_progress
        - done
        - archived
      example: in_progress
    Task:
      type: object
      description: Задача пользователя
      required:
        - id
        - title
        - status
        - created_at
        - moderation
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Подготовить демо для жюри
        status:
          type: string
          enum:
            - draft
            - todo
            - in_progress
            - done
            - archived
          description: Текущий статус
        created_at:
          type: string
          format: date-time
        moderation:
          nullable: true
          description: Итог ИИ-проверки; null, пока проверка ещё не выполнена (обычно несколько секунд)
          type: object
          required:
            - verdict
            - source
            - checked_at
          properties:
            verdict:
              type: string
              enum:
                - ok
                - needs_review
              description: "`needs_review` — правила или модель нашли проблему"
            source:
              type: string
              enum:
                - rules
                - rules+llm
              description: "`rules` — модель была недоступна, решали только правила"
            checked_at:
              type: string
              format: date-time
    TaskPage:
      type: object
      description: Страница задач
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
          minimum: 0
          description: Всего задач под фильтром
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 100000
    CreateTask:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям обрезаются перед сохранением
    UpdateTask:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - todo
            - in_progress
            - done
            - archived
          description: Новый статус
        comment:
          type: string
          maxLength: 2000
          description: Причина смены статуса; обязательна для перехода в archived
    TaskTransition:
      type: object
      description: Один переход статуса
      required:
        - from
        - to
        - actor
        - comment
        - created_at
      properties:
        from:
          type: string
          description: Статус до перехода
        to:
          type: string
          description: Статус после перехода
        actor:
          type: string
          description: Кто сменил статус
        comment:
          type: string
          description: Комментарий (пустой, если не нужен)
        created_at:
          type: string
          format: date-time
    TaskHistoryPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskTransition"
    TaskAnalysis:
      type: object
      description: Рекомендация ИИ-проверки. Флаги и вердикт задают правила; модель только добавляет совет.
      required:
        - task_id
        - verdict
        - flags
        - advice
        - source
        - decision_required
      properties:
        task_id:
          type: string
          format: uuid
        verdict:
          type: string
          enum:
            - ok
            - needs_review
        flags:
          type: array
          description: Что нашли правила
          items:
            type: object
            required:
              - code
              - message
            properties:
              code:
                type: string
                enum:
                  - money
                  - link
                  - contact
                  - shouting
                  - too_short
              message:
                type: string
        advice:
          nullable: true
          description: Совет модели; null — модель недоступна или ответила некорректно
          type: object
          required:
            - summary
            - risk
            - suggestion
          properties:
            summary:
              type: string
              description: Вывод одним предложением
            risk:
              type: string
              enum:
                - low
                - medium
                - high
            suggestion:
              type: string
              description: Что улучшить или проверить
        source:
          type: string
          enum:
            - rules
            - rules+llm
        decision_required:
          type: boolean
          description: Всегда true — система советует, решает человек
    TaskStats:
      type: object
      description: Сводка для админского дашборда
      required:
        - total
        - completed
        - owners
        - moderation
        - by_day
      properties:
        total:
          type: integer
          description: Всего задач
        completed:
          type: integer
          description: В статусе done
        owners:
          type: integer
          description: Сколько пользователей создавали задачи
        moderation:
          type: object
          required:
            - ok
            - needs_review
            - unchecked
          properties:
            ok:
              type: integer
            needs_review:
              type: integer
            unchecked:
              type: integer
              description: Ещё не проверены
        by_day:
          type: array
          description: Создано задач по дням, последние 14 дней
          items:
            type: object
            required:
              - date
              - count
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
  responses:
    BadRequest:
      description: Некорректные входные данные (код ошибки и понятное сообщение в теле)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_body
              message: Ожидается JSON с полем title
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unauthorized:
      description: Пользователь не вошёл или токен недействителен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: Войдите, чтобы продолжить
    Forbidden:
      description: Нет прав (нужна другая роль) или запрос пришёл с чужого адреса (Origin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: Недостаточно прав для этого действия
    NotFound:
      description: Запись не найдена или принадлежит другому пользователю (не различаются намеренно)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Задача не найдена
    TooManyRequests:
      description: "Превышен лимит: 60 изменяющих запросов в минуту на пользователя (для ИИ — 10 в минуту).
        Заголовок `Retry-After` подсказывает, через сколько секунд повторить."
      headers:
        Retry-After:
          schema:
            type: integer
          description: Через сколько секунд можно повторить
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: rate_limit
              message: Слишком много запросов. Подождите минуту
    InternalError:
      description: Внутренняя ошибка; подробности — в логах по request_id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal_error
              message: Не удалось выполнить операцию
              request_id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    Unavailable:
      description: Зависимость временно недоступна (база, хранилище, Redis, модель) — повторите позже
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: cache_unavailable
              message: Попробуйте ещё раз позже
