name: Деплой

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Весь стек на сервер
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/boilerplate' }}
      REMOTE_DIR: /tmp/boilerplate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Подготовить SSH и исходники коммита
        shell: bash
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Не задан секрет $variable"
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT < 65536 ))
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / ]]
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
          cat > "$RUNNER_TEMP/deploy_ssh_config" <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile $RUNNER_TEMP/deploy_key
            UserKnownHostsFile $RUNNER_TEMP/deploy_known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          git archive --format=tar.gz "$GITHUB_SHA" > "$RUNNER_TEMP/source.tar.gz"
      - name: Доставить и развернуть весь стек
        shell: bash
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/deploy_ssh_config" deploy-target "mkdir -m 700 '$REMOTE_DIR'"
          scp -F "$RUNNER_TEMP/deploy_ssh_config" "$RUNNER_TEMP/source.tar.gz" deploy/deploy.sh "deploy-target:$REMOTE_DIR/"
          ssh -F "$RUNNER_TEMP/deploy_ssh_config" deploy-target \
            "bash '$REMOTE_DIR/deploy.sh' '$DEPLOY_PATH' '$GITHUB_SHA' '$REMOTE_DIR/source.tar.gz'"
      - name: Удалить временные файлы
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/deploy_ssh_config" ]]; then
            ssh -F "$RUNNER_TEMP/deploy_ssh_config" deploy-target "rm -rf -- '$REMOTE_DIR'" || true
          fi
          rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts" "$RUNNER_TEMP/deploy_ssh_config" "$RUNNER_TEMP/source.tar.gz"
