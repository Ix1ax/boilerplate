openapi: 3.0.3
info:
  title: API стартового проекта
  version: 0.1.0
  description: >-
    Контракт Go API. Браузер использует одноимённые маршруты через BFF Next.js; токены BFF хранит в
    HttpOnly cookies.
servers:
  - url: http://localhost:18080
    description: Локальный Go API
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Проверить, что процесс работает
      security: []
      responses:
        '200':
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      summary: Проверить PostgreSQL, Redis и S3
      security: []
      responses:
        '200':
          description: Зависимости доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Одна из зависимостей недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/me:
    get:
      summary: Получить текущего пользователя
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/ping:
    get:
      summary: Проверить роль администратора
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Требуется realm-роль admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tasks:
    get:
      summary: Получить свои задачи
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
    post:
      summary: Создать задачу
      responses:
        '201':
          description: Запрос выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Зависимость временно недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
  /api/v1/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      summary: Отметить свою задачу
      responses:
        '200':
          description: Запрос выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Запись не найдена или принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Зависимость временно недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
    delete:
      summary: Удалить свою задачу
      responses:
        '204':
          description: Запрос выполнен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Запись не найдена или принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Зависимость временно недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/files:
    post:
      summary: Загрузить приватный файл
      responses:
        '201':
          description: Запрос выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Превышен размер запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Недопустимый тип файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Зависимость временно недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: До 10 МиБ. PNG, JPEG, WebP, PDF или текст. Тип определяется по содержимому.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
  /api/v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      summary: Скачать свой файл
      responses:
        '200':
          description: Содержимое файла; имя передаётся в Content-Disposition
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Запись не найдена или принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Удалить свой файл
      responses:
        '204':
          description: Запрос выполнен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Запись не найдена или принадлежит другому пользователю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Превышен лимит запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Зависимость временно недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    Task:
      type: object
      required:
        - id
        - title
        - completed
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
    TaskPage:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 100000
    User:
      type: object
      required:
        - id
        - email
        - name
        - roles
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
    CreateTask:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Пробелы по краям обрезаются перед сохранением
    UpdateTask:
      type: object
      additionalProperties: false
      required:
        - completed
      properties:
        completed:
          type: boolean
    File:
      type: object
      required:
        - id
        - name
        - size
        - content_type
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        content_type:
          type: string
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
  responses:
    BadRequest:
      description: Некорректные входные данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нужен действующий токен доступа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Не удалось выполнить операцию
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
