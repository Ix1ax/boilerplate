        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/moderation/log:
    get:
      tags:
        - Админка
      operationId: moderationLog
      summary: Журнал модерации
      description:
        Решения по организациям, смена статуса мероприятий (снятие, удаление, возврат, отмена — в том
        числе автоматическая, когда не собран состав) и скрытие сообщений. Кто, когда и с какой причиной.
      parameters:
        - name: entity
          in: query
          description: organization, event или comment; несколько — через запятую
          schema:
            type: string
        - name: to
          in: query
          description: Новый статус, например rejected или unpublished
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Поиск по названию, автору решения и причине
          schema:
            type: string
            maxLength: 100
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - at
              - -at
            default: -at
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Страница журнала
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/moderation/comments:
