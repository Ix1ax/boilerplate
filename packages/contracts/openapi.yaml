        Что требует решения (заявки организаций, самые давние — первыми) и как живёт платформа — события,
        записи, новички, сообщения, «Ищу компанию», сбор состава, ряд за 14 дней по Красноярску и популярные
        направления.
      responses:
        '200':
          description: Дашборд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
