    get:
      tags:
        - Файлы
      operationId: listFiles
      summary: Список своих файлов
      description: Новые сверху. С `entity_type` и `entity_id` — только файлы, приложенные к этой записи.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: entity_type
          in: query
          description: Тип записи (латиница и «_»), указывается вместе с entity_id
          schema:
            type: string
            pattern: ^[a-z][a-z_]{0,29}$
          example: application
        - name: entity_id
          in: query
          description: Идентификатор записи
          schema:
            type: string
            pattern: ^[A-Za-z0-9-]{1,64}$
          example: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
      responses:
        '200':
          description: Страница файлов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePage'
              example:
                items:
                  - id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    name: устав.pdf
                    size: 182044
                    content_type: application/pdf
                    created_at: 2026-10-18T09:40:00Z
                    entity:
                      type: application
                      id: 3f6c2a4e-8b1d-4c3a-9e2f-1a2b3c4d5e6f
                total: 1
                limit: 20
                offset: 0
        '400':
          description:
            '`invalid_pagination` или `invalid_entity` (заполнена только одна часть привязки или неверный
            формат)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Файлы
      operationId: uploadFile
      summary: Загрузить файл
      description: Отправьте multipart/form-data с полем `file`; для привязки к записи — ещё `entity_type` и `entity_id`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл до 10 МиБ
                entity_type:
                  type: string
                  pattern: ^[a-z][a-z_]{0,29}$
                  description: Тип записи, к которой приложить файл
                entity_id:
                  type: string
                  pattern: ^[A-Za-z0-9-]{1,64}$
                  description: Идентификатор записи
      responses:
        '201':
          description: Файл сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
        '400':
          description: '`invalid_body` (нет поля file, пустой файл, недопустимое имя) или `invalid_entity`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Файл больше 10 МиБ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: payload_too_large
                  message: Файл превышает 10 МиБ или запрос имеет неверный формат
        '415':
          description: Тип содержимого не разрешён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: unsupported_type
                  message: Можно загрузить PNG, JPEG, WebP, PDF или текстовый файл
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/files/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Файлы
      operationId: downloadFile
      summary: Скачать файл
      description:
        'Отдаётся как вложение (`Content-Disposition: attachment`) с исходным именем; браузер не
        исполняет содержимое.'
      responses:
        '200':
          description: Содержимое файла
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags:
        - Файлы
      operationId: deleteFile
      summary: Удалить файл
      description: Удаляет содержимое из S3, затем метаданные. Если S3 недоступно — 503, повтор безопасен.
      responses:
        '204':
          description: Файл удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/accounts:
    get:
      tags:
        - Учётные записи (админ)
      operationId: listAccounts
      summary: Учётные записи обычной регистрации
      description:
        Поиск по почте и имени среди пользователей, зарегистрированных по почте и паролю. Пользователи
        «Столото ID» живут в Keycloak и здесь не показываются.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          description: Часть почты или имени (до 100 символов)
          schema:
            type: string
            maxLength: 100
          example: anna
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            type: string
            enum:
              - active
              - blocked
      responses:
        '200':
          description: Страница учётных записей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags:
        - Учётные записи (админ)
      operationId: getAccount
      summary: Карточка учётной записи
      description: Статус, последний вход и история — регистрация, блокировки, смены пароля.
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/accounts/{id}/block:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Учётные записи (админ)
      operationId: blockAccount
      summary: Заблокировать учётную запись
      description:
        Вход по паролю закрывается сразу; уже открытые сессии gateway закрывает при следующей сверке
        статуса (не дольше 30 секунд). Причину пользователь увидит при попытке входа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: Массовая рассылка рекламы в обсуждениях
      responses:
        '200':
          description: Заблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/accounts/{id}/unblock:
    parameters:
      - $ref: '#/components/parameters/ID'
    post:
      tags:
        - Учётные записи (админ)
      operationId: unblockAccount
      summary: Разблокировать учётную запись
      responses:
        '200':
          description: Разблокирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/llm/status:
    get:
      tags:
        - Модель
      operationId: getLlmStatus
      summary: Состояние модели
      responses:
        '200':
          description: Доступна ли Ollama и скачана ли модель
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - model
                  - model_installed
                properties:
                  available:
                    type: boolean
                    description: Ollama отвечает
                  model:
                    type: string
                  model_installed:
                    type: boolean
                    description: Нужная модель скачана
              example:
                available: true
                model: qwen2.5:1.5b
                model_installed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/llm/generate:
    post:
      tags:
        - Модель
      operationId: generate
      summary: Ответ модели целиком
      description: Ждёт полный ответ (до нескольких десятков секунд на CPU). Для чата удобнее поток — /llm/stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmPrompt'
            examples:
              text:
                summary: Обычный ответ
                value:
                  prompt: Придумай название для волонтёрского проекта
              json:
                summary: Структурированный ответ
                value:
                  system: 'Ответь JSON: {"title": string}'
                  prompt: Придумай название
                  json: true
                  temperature: 0.2
      responses:
        '200':
          description: Ответ модели
          content:
            application/json:
              schema:
                type: object
                required:
                  - text
                  - model
                properties:
                  text:
                    type: string
                  model:
                    type: string
              example:
                text: «Доброе дело рядом»
                model: qwen2.5:1.5b
        '400':
          description: Пустой запрос, слишком длинный или неверная temperature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: validation_error
                  message: Запрос должен содержать от 1 до заданного предела символов
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Лимит запросов (`rate_limit`) или модель занята (`model_busy`, повторите через несколько секунд)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: model_busy
                  message: Модель занята, повторите через несколько секунд
        '503':
          description: Модель не запущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: model_unavailable
                  message: Модель недоступна. Запустите её командой make llm
  /api/v1/llm/stream:
    post:
      tags:
        - Модель
      operationId: generateStream
      summary: Ответ модели потоком (SSE)
      description: |
        Текст приходит по частям, пока модель генерирует: события `data: {"t": "фрагмент"}`,
        в конце `event: done`, при сбое посреди ответа — `event: error`. Ошибки до начала потока
        (400, 429, 503) приходят обычным JSON, как у /llm/generate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmPrompt'
            example:
              prompt: Объясни в двух предложениях, что такое волонтёрство
      responses:
        '200':
          description: Поток фрагментов
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                data: {"t":"Волонтёрство — "}

                data: {"t":"это добровольная помощь…"}

                event: done
                data: {}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/admin/moderation/dashboard:
    get:
      tags:
