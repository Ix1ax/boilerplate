  /api/v1/my/company-requests:
    get:
      tags:
        - Ищу компанию
      operationId: listMyCompanyRequests
      summary: Мои запросы «Ищу компанию»
      description:
        Активные первыми. Истёкший запрос (старше 30 дней) возвращается со статусом `expired` и
        уведомлений больше не присылает.
      responses:
        '200':
          description: Запросы
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanyRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Ищу компанию
      operationId: createCompanyRequest
      summary: Ищу компанию
      description:
        Человек описывает, чем и когда хочет заниматься. Уже опубликованные подходящие события сразу
        попадают в подборку (`matches_count`, `GET …/matches`). Когда кто-то опубликует новое подходящее
        событие, придёт уведомление «Нашлась компания». Подходит, если совпадает направление, уровень
        совместим («не важно» с любой стороны или точное совпадение), время суток и день недели — по местному
        времени события, а при заданной точке — событие в радиусе. Один активный запрос на направление (повтор
        — 409). Своё направление заводится в справочнике.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequestInput'
            example:
              sport_name: Бег
              level: beginner
              day_parts:
                - morning
              weekdays:
                - 6
                - 7
              area: Рядом с Октябрьским районом
              lat: 56.0153
              lng: 92.8932
              radius_km: 5
              note: Бегаю 3–5 км, хочу компанию, чтобы не бросить
      responses:
        '201':
          description: Запрос создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/my/company-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    patch:
      tags:
        - Ищу компанию
      operationId: updateCompanyRequest
      summary: Изменить собственный активный запрос
      description:
        Полная замена условий; новая редакция отменяет ответы на прежний общий вариант. Чужой или
        истёкший запрос — 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequestInput'
      responses:
        '200':
          description: Актуальный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags:
        - Ищу компанию
      operationId: getMyCompanyRequest
      summary: Мой запрос «Ищу компанию»
      responses:
        '200':
          description: Запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyRequest'
        '401':
