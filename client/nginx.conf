server {
    listen 8080;
    server_name _;
    # Внешние HTTPS и порт задаёт reverse proxy, поэтому Location остаётся относительным.
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 11m;

    # Каждая SPA собирается отдельно; /admin сохраняется при передаче upstream.
    location = /admin {
        return 308 /admin/$is_args$args;
    }
    location ^~ /admin/ {
        proxy_pass http://admin-service:8080;
        proxy_set_header Host $host;
    }

    # Проверять обновления PWA при каждом запуске, без долгого HTTP-кэша.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SSE и долгие ответы LLM: без буферизации и с увеличенным таймаутом.
    # WebSocket: upgrade-заголовки и долгий таймаут (простой контролирует сервис realtime).
    location = /api/v1/ws {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location = /api/v1/notifications/stream {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }
    location /api/v1/llm/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 35s;
    }
    location /auth/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
    }
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location = /readyz {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
