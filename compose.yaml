services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --save "" --appendonly no',
      ]
    ports: ['127.0.0.1:16379:6379']
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:4.37
    command: [mini, '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
    ports: ['127.0.0.1:18333:8333']
    volumes: [s3-data:/data]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:18025:8025']
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?required}
      SECOND_DEMO_PASSWORD: ${SECOND_DEMO_PASSWORD:?required}
      KC_HOSTNAME: http://localhost:18180
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx384m'
    ports: ['127.0.0.1:18180:8080']
    volumes: [./.local/keycloak:/opt/keycloak/data/import:ro]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
  migrate:
    profiles: [app]
    build: ./apps/api
    entrypoint: [migrate]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: [app]
    build: ./apps/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/hackathon
      OIDC_CLIENT_ID: hackathon-api
    ports: ['127.0.0.1:18080:8080']
    restart: on-failure:3
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      s3: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8080
      APP_ORIGIN: ${APP_ORIGIN}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/hackathon
      OIDC_CLIENT_ID: hackathon-web
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
    ports: ['127.0.0.1:13000:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  s3-data:
