services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make setup}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction --save "" --appendonly no',
      ]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:4.37
    command: [mini, '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
    ports: ['127.0.0.1:8333:8333']
    volumes: [s3-data:/data]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:8025:8025']
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    ports: ['127.0.0.1:11434:11434']
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 30
  ollama-pull:
    profiles: [llm]
    image: ollama/ollama:latest
    entrypoint: [ollama, pull, '${LLM_MODEL:-qwen2.5:3b}']
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: { condition: service_healthy }
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?required}
      SECOND_DEMO_PASSWORD: ${SECOND_DEMO_PASSWORD:?required}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: 'true'
      JAVA_OPTS_KC_HEAP: '-Xms128m -Xmx384m'
    ports: ['127.0.0.1:8180:8080']
    volumes: [./.local/keycloak:/opt/keycloak/data/import:ro]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; grep -q "200 OK" <&3'
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
  # У каждого сервиса своя база и свои миграции; миграции входят в бинарник сервиса.
  tasks-migrate:
    profiles: [app]
    build: ./apps/tasks
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tasks?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
  files-migrate:
    profiles: [app]
    build: ./apps/files
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/files?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
  tasks:
    profiles: [app]
    build: ./apps/tasks
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tasks?sslmode=disable
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run make setup}
    restart: on-failure:3
    depends_on:
      tasks-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 30
  files:
    profiles: [app]
    build: ./apps/files
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/files?sslmode=disable
      S3_ENDPOINT: http://s3:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run make setup}
    restart: on-failure:3
    depends_on:
      s3: { condition: service_started }
      files-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 30
  # Gateway: единственный публичный вход. Проверяет сессию/JWT и проксирует в tasks и files.
  api:
    profiles: [app]
    build: ./apps/gateway
    environment:
      APP_ENV: development
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_INTERNAL_URL: http://keycloak:8080/realms/hackathon
      OIDC_CLIENT_ID: hackathon-api
      OIDC_WEB_CLIENT_ID: hackathon-web
      APP_ORIGIN: ${APP_ORIGIN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      TASKS_URL: http://tasks:8080
      FILES_URL: http://files:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?run make setup}
      LLM_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    ports: ['127.0.0.1:8080:8080']
    restart: on-failure:3
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      tasks: { condition: service_healthy }
      files: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:3000:8080']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  s3-data:
  ollama-data:
