server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location = /admin {
        return 308 /admin/$is_args$args;
    }
    # Отсутствующий asset не должен превращаться в HTML и ломать загрузку модулей.
    location /admin/assets/ {
        try_files $uri =404;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
    location / {
        return 404;
    }
}
